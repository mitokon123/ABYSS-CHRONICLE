<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>動作の確かめ - ABYSS CHRONICLE</title>
  <script src="tools/devguard.js"></script>
  <!--
    ▼ このファイルについて（開発用。ゲーム本体ではない）

    直した不具合が戻っていないか・決めた動きが崩れていないかを、ボタン1つで確かめる（v1.3.1）。
    ゲームの本物のコード（app.html が読むファイル）をそのまま読み込んで、その場で動かして比べる。

    ・セーブの確かめは、ふだんのセーブとは別のキー（__abyss_check__.save）にだけ書き、終わったら消す。
      ふだんのセーブ（my-first-app.save …）は読むだけで、確かめの前後で1文字も変わっていないことも確かめる
    ・確かめを足すときは、下の CHECKS に1つ足す（title・why・run）。run は { ok, lines } を返す

    データの書き間違いは「データの点検」（data-check.html）、強さは「強さの試算」（balance-sim.html）。
  -->
  <style>
    body { margin: 0; background: #05070d; color: #c8d0e8; font-family: sans-serif; font-size: 13px; }
    main { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
    h1 { font-size: 20px; color: #ffd75e; margin: 0 0 4px; }
    h1 a { font-size: 12px; color: #6b7590; margin-left: 12px; font-weight: normal; }
    .sub { color: #6b7590; font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
    #summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
    .pill { padding: 6px 12px; border-radius: 14px; border: 1px solid #2a3350; background: #0a0f1c; }
    .pill b { font-size: 16px; margin-right: 4px; }
    .pill.err b { color: #ff7a7a; } .pill.good b { color: #8fd18f; }
    details { border: 1px solid #2a3350; border-radius: 6px; margin: 8px 0; background: #0a0f1c; }
    details summary { padding: 8px 12px; cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▸"; color: #4e5876; }
    details[open] summary::before { content: "▾"; }
    .tag { font-size: 11px; padding: 1px 7px; border-radius: 3px; flex: none; }
    .tag.err { background: #4a1818; color: #ff9a9a; } .tag.good { background: #143018; color: #8fd18f; }
    .since { color: #6b7590; font-size: 11px; margin-left: auto; }
    .why { color: #6b7590; font-size: 12px; padding: 0 12px 6px 34px; line-height: 1.6; }
    ul { margin: 0; padding: 4px 12px 10px 34px; }
    li { padding: 2px 0; line-height: 1.6; }
    li.bad { color: #ff9a9a; }
    code { font-family: monospace; color: #e8ecf8; background: #141b2e; padding: 0 4px; border-radius: 3px; }
    #loading { color: #6b7590; }
    button { background: #141b2e; color: #e8ecf8; border: 1px solid #2a3350; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: #ffd75e; }
  </style>
</head>
<body>
  <main>
    <h1>動作の確かめ <a href="dev.html">← 開発用の目次</a></h1>
    <div class="sub">
      直した不具合が戻っていないか・決めた動きが崩れていないかを、本物のゲームのコードを動かして確かめる。
      ふだんのセーブには書かない。コードを直したら <button onclick="location.reload()">もう一度確かめる</button>
    </div>
    <div id="loading">ゲームのコードを読んでいます…</div>
    <div id="summary"></div>
    <div id="results"></div>
  </main>

  <script src="tools/devpage.js"></script>
  <script>
  (function () {
    "use strict";
    var D = window.DevPage, esc = D.esc;
    var CHECK_KEY = "__abyss_check__.save";

    // ─────────────────────────────────────────
    // 確かめの一覧。足すときはここに1つ足す
    //   title … 何を確かめるか   since … いつ直した・決めたか   why … 崩れるとどうなるか
    //   run(ctx) … { ok: true/false, lines: ["…", …] }。lines の先頭に "✗ " を付けた行は赤くなる
    // ─────────────────────────────────────────
    var CHECKS = [
      {
        title: "経験値・ゴールドが 1 少なくならない",
        since: "v1.3.1",
        why: "基礎 × (1 + (Lv−1) × 0.15) を小数のまま切り捨てると、計算機の誤差で 1 少なくなることがあった（カラクリモリ Lv32 の G が 903）。全種族・Lv1〜99 を、誤差の出ない整数の計算と比べる。",
        run: checkRewards
      },
      {
        title: "控えの仲間も状態異常・強化弱体のターンが進む",
        since: "v1.3.1",
        why: "控えに下げた仲間の麻痺・強化が、場の仲間と同じく毎ターン1つ減って切れる。毒（残りターンなし）は控えでは減らず、ダメージも受けない。",
        run: checkBench
      },
      {
        title: "セーブをファイルに書き出して、読み込める",
        since: "v1.3.1",
        why: "書き出したファイルを別のスロットへ読み込むと、本体・設定が1文字も変わらずに入り、古い中断は消える。壊れたファイル・形式の違うファイルは断る。ふだんのセーブには触らない。",
        run: checkSaveFile
      },
      {
        title: "逃げたあと、強化・弱体と状態異常を持ち越さない",
        since: "v1.3.1",
        why: "逃げるのに成功したときだけ後片づけをしていなかったので、強化・弱体と麻痺・眠りなどが次の戦闘まで残っていた。毒だけは持ち帰る（ほかの終わり方と同じ）。",
        run: checkFlee
      },
      {
        title: "範囲の技が通常攻撃に変わっても「立ち塞がる」が効く",
        since: "v1.3.1",
        why: "全体攻撃の技を出す番に PP が足りないと通常攻撃に変わる。そのとき立ち塞がっている相手を素通りして、先頭の1体を殴っていた。",
        run: checkCoverFallback
      },
      {
        title: "戦闘を乱数で 300 回まわしても壊れない",
        since: "v1.3.1",
        why: "でたらめな仲間・装備・作戦・敵（主も）で戦わせ、止まる・HP や PP が範囲の外・文に undefined や NaN・枠に同じ仲間が2回、などが起きないかを見る。毎回同じ乱数なので、崩れたら同じ所で崩れる。",
        run: checkBattleFuzz
      },
      {
        title: "図鑑をぜんぶめくっても止まらない",
        since: "v1.4.0",
        why: "図鑑を見開きの本に作り直した。何も分かっていない・出会っただけ・ぜんぶ分かった、の3つの進み具合で、モンスターを全部めくり、ほかの表も下まで送る。止まる・文に undefined が出る・まだ出会っていない相手の名前や説明が見えてしまう・文がページからはみ出す、が起きないかを見る。",
        run: checkDex
      },
      {
        title: "工房の説明が崩れない",
        since: "v1.4.0",
        why: "工房の右に、足りない素材の手に入る場所を開けるようにした（図鑑と同じ中身。はじめは閉じている）。何も分かっていない・ぜんぶ分かった・素材をたくさん持っている、の3つで、レシピを全部選び、C で開いて、説明をバーの端まで送る。開く前から手に入る場所が出る・C で開かない・文に undefined が出る・まだ出会っていない相手の名前が見える・足りているのに手に入る場所が出る・文が枠からはみ出す、が起きないかを見る。",
        run: checkCraft
      },
      {
        title: "お店の説明が崩れない",
        since: "v1.4.0",
        why: "お店の右に、装備の「仲間がつけると」（連れている仲間ごとの能力の変わり方）と素材の使い道を出すようにした。すべての店の買う・売るを全部選び、文に undefined が出る・見比べで仲間の装備や能力が変わってしまう・文が枠からはみ出す、が起きないかを見る。",
        run: checkShop
      },
      {
        title: "持ち物の説明が崩れない",
        since: "v1.4.0",
        why: "使う道具の効果・装備の見比べ・素材の使い道・手に入る場所の開け閉めが、どの品でも崩れない",
        run: checkItems
      },
      {
        title: "仲間の画面の説明が崩れない",
        since: "v1.4.0",
        why: "全種族で一覧・預かり所の右の欄と、様子を見るの3ページを描き、文がはみ出さない・最後まで送れる・装備が変わらないことを見る",
        run: checkParty
      },
      {
        title: "設定の画面が崩れない",
        since: "v1.4.0",
        why: "項目名と横棒・すべての値と ▶・説明・操作キーの名前と札が、枠に収まって重ならない",
        run: checkSettings
      },
      {
        title: "お店の絞り込み",
        since: "v1.4.0",
        why: "F で分類・素材の手に入る場所に絞れる。空の絞り込みが札に出たり、数が合わなかったりしないか",
        run: checkShopFilter
      },
      {
        title: "加護を選ぶ",
        since: "v1.4.0",
        why: "等級・入れている・外しているで絞れる。違う加護が混ざらないか、入れ外しで選択が飛ばないか",
        run: checkBlessingSelect
      },
      {
        title: "ダンジョンを選ぶ",
        since: "v1.4.0",
        why: "右の説明を共通の部品にした。クリアの進みごとに、文がはみ出さず、モンスターと品が漏れなく並ぶか",
        run: checkDungeonSelect
      },
      {
        title: "加護の選択・挑戦の結果・セーブの画面が崩れない",
        since: "v1.4.0",
        why: "v1.4.0 で絵と札を足した。どの加護でも文が枠に収まるか、結果に仲間のレベルの伸びが出るか、セーブの行で文が重ならないか",
        run: checkRunScreens
      },
      {
        title: "遊び方・拠点のひと言・折り返し",
        since: "v1.4.0",
        why: "v1.4.0 で遊び方の右を共通の部品にし、拠点に選んでいる項目のひと言を足した。「Q / E」が2行に割れていたのも直した",
        run: checkHelpHome
      },
      {
        title: "名前と見た目を決める画面が崩れない",
        since: "v1.4.0",
        why: "v1.4.0 で左の姿に台・向きの札・冒険中の大きさ、右に見出し、下にひと言を足した。名前が8文字でも、どの欄でも文が枠や戻るボタンにかからないか。Q/E の向きと R のおまかせも",
        run: checkPlayerSetup
      },
      {
        title: "戦闘の効き目・範囲・ログ",
        since: "v1.4.0",
        why: "v1.4.0 で、スカウトした相手にだけ技の効き目の印、技の説明に範囲の札、ターンの頭にログを足した。知らない相手に印が出ないか・札が重ならないか・ログが開け閉めできるか",
        run: checkBattleMarks
      },
      {
        title: "体技・ちからため・即死の見直し",
        since: "v1.4.1",
        why: "1.4.1 で体技の式（1体は通常攻撃の倍率・全体は固定）・クリティカルなし・体当たりの盲目・ちからため の乗る技と消えるとき・即死の確率と耐性を変えた。数字が仕様書どおりか確かめる",
        run: checkSkillReview141
      },
      {
        title: "版の名前がそろっている",
        since: "v1.3.1",
        why: "data/config.js の version・パッチノートの先頭・README の「現在のバージョン」が同じ。「開発中」の日付は先頭の版だけ。",
        run: checkVersion
      }
    ];

    D.loadGame(function () {
      var NS = window.MyGame;
      if (!NS || !NS.rawData || !NS.DataLoader) {
        document.getElementById("loading").textContent = "ゲームのコードを読めませんでした。";
        return;
      }
      var ctx = { NS: NS, raw: NS.rawData, gd: NS.DataLoader.build(NS.rawData) };
      var results = [];
      (function next(i) {
        if (i >= CHECKS.length) { render(results); return; }
        var c = CHECKS[i];
        Promise.resolve().then(function () { return c.run(ctx); }).then(function (r) {
          results.push({ check: c, result: r });
        }, function (e) {
          results.push({ check: c, result: { ok: false, lines: ["✗ 途中で止まった：" + (e && e.message || e)] } });
        }).then(function () { next(i + 1); });
      })(0);
    });

    // --- 1. 報酬 ---
    function checkRewards(ctx) {
      var NS = ctx.NS, gd = ctx.gd, growth = gd.growth || {};
      var lines = [], bad = [], count = 0;
      var kinds = [["exp", "expReward", "expRewardPerLevel", "getExpReward"],
                   ["gold", "goldReward", "goldRewardPerLevel", "getGoldReward"]];
      Object.keys(gd.monsters).forEach(function (id) {
        var m = new NS.MonsterInstance(id, 1, gd, {});
        var sp = gd.monsters[id];
        for (var lv = 1; lv <= 99; lv++) {
          m.level = lv;
          kinds.forEach(function (k) {
            var base = sp[k[1]] || 0;
            var per = growth[k[2]];
            var fixed = !per || (k[0] === "exp" && sp.expFixed);
            // 0.15 を 150/1000 にして、整数だけで計算する（誤差が出ない）
            var expect = fixed ? Math.floor(base)
              : Math.floor(base * (1000 + (lv - 1) * Math.round(per * 1000)) / 1000);
            var got = m[k[3]]();
            count++;
            if (got !== expect && bad.length < 20) bad.push("✗ " + sp.name + " Lv" + lv + " の " + k[0] + "：" + got + "（正しくは " + expect + "）");
          });
        }
      });
      var gw = gd.monsters.gearWarden ? new NS.MonsterInstance("gearWarden", 32, gd, {}) : null;
      if (gw) {
        var g = gw.getGoldReward();
        lines.push((g === 904 ? "" : "✗ ") + "カラクリモリ Lv32 の G：" + g + "（904 のはず）");
        if (g !== 904) bad.push("x");
      }
      lines.unshift(Object.keys(gd.monsters).length + " 種族 × Lv1〜99 × 経験値・ゴールド ＝ " + count + " 通りを比べた");
      return { ok: bad.length === 0, lines: lines.concat(bad.filter(function (b) { return b !== "x"; })) };
    }

    // --- 2. 控えのターン ---
    function checkBench(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var rnd = new NS.Random(12345);
      function mk(id, lv) { return new NS.MonsterInstance(id, lv, gd, {}); }
      var ids = Object.keys(gd.monsters).filter(function (id) { return id !== "shinigami"; });
      var allies = [mk(ids[0], 30), mk(ids[1], 30), mk(ids[2], 30), mk(ids[3], 30), mk(ids[4], 30)];
      var enemy = mk("slime", 1);
      var sys = new NS.BattleSystem(gd, rnd);
      sys.start(allies, [enemy]);

      var field = allies[0], benchA = allies[3], benchP = allies[4];
      var harden = gd.skills.harden;
      field.addModifier(harden);
      benchA.addModifier(harden);
      benchA.addStatus("paralysis");          // 乱数なし ＝ いちばん長い残りターン
      benchP.addStatus("poison");
      var hpBefore = benchP.currentHp;
      var para0 = benchA.getStatus("paralysis").remaining;
      var mod0 = benchA.getModifier("harden").remaining;

      var lines = ["場の外：" + gd.monsters[benchA.speciesId].name + "（麻痺 " + para0 + " ターン・こうか " + mod0 + " ターン）・"
        + gd.monsters[benchP.speciesId].name + "（毒）"];
      var ok = true;
      for (var t = 1; t <= para0 + 1; t++) {
        sys.takeTurn([{ type: "skip" }, { type: "skip" }, { type: "skip" }]);
        var p = benchA.getStatus("paralysis"), mb = benchA.getModifier("harden"), mf = field.getModifier("harden");
        var pWant = Math.max(0, para0 - t), mWant = Math.max(0, mod0 - t);
        var pGot = p ? p.remaining : 0, mbGot = mb ? mb.remaining : 0, mfGot = mf ? mf.remaining : 0;
        var good = pGot === pWant && mbGot === mWant && mbGot === mfGot;
        if (!good) ok = false;
        lines.push((good ? "" : "✗ ") + t + " ターン後：控えの麻痺 " + pGot + "（" + pWant + " のはず）・控えのこうか " + mbGot + "・場のこうか " + mfGot);
        if (sys.finished) { lines.push("✗ 戦闘が途中で終わった"); ok = false; break; }
      }
      var poison = benchP.getStatus("poison");
      var poisonOk = !!poison && benchP.currentHp === hpBefore;
      if (!poisonOk) ok = false;
      lines.push((poisonOk ? "" : "✗ ") + "控えの毒：" + (poison ? "残っている" : "消えた") + "・HP " + hpBefore + " → " + benchP.currentHp);
      if (sys.slots.indexOf(benchA) >= 0 || sys.slots.indexOf(benchP) >= 0) { ok = false; lines.push("✗ 控えのはずの仲間が場にいる"); }
      return { ok: ok, lines: lines };
    }

    // --- 3. セーブのファイル ---
    function checkSaveFile(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var realPrefix = (gd.save || {}).storageKey || "game.save";
      var before = snapshot(realPrefix);

      // ふだんとは別のキーに書く SaveManager
      var gdCheck = Object.create(gd);
      gdCheck.save = {};
      Object.keys(gd.save || {}).forEach(function (k) { gdCheck.save[k] = gd.save[k]; });
      gdCheck.save.storageKey = CHECK_KEY;
      var sm = new NS.SaveManager(gdCheck);

      var lines = [], ok = true;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }

      try {
        clearCheckKeys();
        var lead = new NS.MonsterInstance("slime", 12, gd, { nickname: "かくにん" });
        var payload = sm._buildPayload({
          party: { toSaveData: function () { return { members: [lead.toSaveData()] }; } },
          gold: 4321, playerName: "確かめ", clearedDungeons: { cradleCave: true }
        });
        localStorage.setItem(sm.keyFor(1), JSON.stringify(payload));
        localStorage.setItem(sm.settingsKeyFor(1), JSON.stringify({ bgmVolume: 0.3 }));
        // 行き先に古い中断を置いておく（読み込んだら消えるはず）
        localStorage.setItem(sm.suspendKeyFor(2), "{\"old\":true}");

        var ex = sm.exportSlot(1);
        expect(ex.success && /^ABYSS-CHRONICLE_slot1_\d{8}-\d{4}\.json$/.test(ex.fileName), "書き出し：" + ex.reason + "（" + (ex.fileName || "") + "）");
        var parsed = sm.parseImport(ex.text);
        expect(parsed.success && parsed.summary.leadName === "かくにん" && parsed.summary.level === 12,
          "ファイルを調べる：" + parsed.reason + "（" + (parsed.summary ? parsed.summary.leadName + " Lv" + parsed.summary.level : "") + "）");
        var im = sm.importToSlot(parsed.file, 2);
        expect(im.success, "スロット2へ読み込む：" + im.reason);
        expect(localStorage.getItem(sm.keyFor(2)) === localStorage.getItem(sm.keyFor(1)), "本体が1文字も変わらずに入った");
        expect(localStorage.getItem(sm.settingsKeyFor(2)) === localStorage.getItem(sm.settingsKeyFor(1)), "設定も一緒に入った");
        expect(localStorage.getItem(sm.suspendKeyFor(2)) === null, "行き先にあった古い中断は消えた");
        sm.setSlot(2);
        var loaded = sm.load();
        expect(loaded.success && loaded.state.gold === 4321, "読み込んだスロットで遊べる（load：" + loaded.reason + "）");

        expect(sm.parseImport("こわれた文字").reason === "importBroken", "JSON でない文字は断る");
        expect(sm.parseImport("{\"format\":\"other\",\"save\":\"{}\"}").reason === "importBroken", "ほかのファイル（format が違う）は断る");
        var old = JSON.parse(ex.text), oldSave = JSON.parse(old.save);
        oldSave.version = 999; old.save = JSON.stringify(oldSave);
        expect(sm.parseImport(JSON.stringify(old)).reason === "importVersion", "セーブの形式（version）が違うファイルは断る");
      } finally {
        clearCheckKeys();
      }
      expect(snapshot(realPrefix) === before, "ふだんのセーブ（" + realPrefix + " …）は変わっていない");
      expect(snapshot(CHECK_KEY) === "", "確かめに使ったキーは消した");
      return { ok: ok, lines: lines };
    }

    function snapshot(prefix) {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(prefix) === 0) keys.push(k);
      }
      keys.sort();
      return keys.map(function (k) { return k + "=" + localStorage.getItem(k); }).join("\n");
    }
    function clearCheckKeys() {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(CHECK_KEY) === 0) keys.push(k);
      }
      keys.forEach(function (k) { localStorage.removeItem(k); });
    }

    // 必ず同じ値を返す乱数（next は 0 ＝ 逃走・命中などが必ず決まる）
    var FIXED_ZERO = { next: function () { return 0; }, nextInt: function (a) { return a; }, pick: function (x) { return x[0]; } };

    // --- 逃走のあと ---
    function checkFlee(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var a = [new NS.MonsterInstance("slime", 20, gd, {}), new NS.MonsterInstance("batty", 20, gd, {})];
      var sys = new NS.BattleSystem(gd, FIXED_ZERO);
      sys.start(a, [new NS.MonsterInstance("slime", 5, gd, {})]);
      a[0].addModifier(gd.skills.harden);
      a[0].addStatus("paralysis");
      a[1].addStatus("sleep");
      a[1].addStatus("poison");
      sys.takeTurn([{ type: "flee" }, { type: "skip" }]);

      var lines = [], ok = true;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }
      expect(sys.result === "flee", "結果：" + sys.result);
      expect(a[0].modifiers.length === 0, "強化・弱体：" + (a[0].modifiers.map(function (m) { return m.id; }).join("・") || "なし"));
      expect(!a[0].getStatus("paralysis") && !a[1].getStatus("sleep"), "麻痺・眠り：" +
        ([a[0].getStatus("paralysis") ? "麻痺が残った" : "", a[1].getStatus("sleep") ? "眠りが残った" : ""].filter(Boolean).join("・") || "外れた"));
      expect(!!a[1].getStatus("poison"), "毒は持ち帰る：" + (a[1].getStatus("poison") ? "残っている" : "消えた"));
      return { ok: ok, lines: lines };
    }

    // --- 立ち塞がる × PP 切れの範囲技 ---
    function checkCoverFallback(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var allEnemySkill = Object.keys(gd.skills).filter(function (id) {
        var s = gd.skills[id];
        return s.target === "allEnemies" && s.pp > 0 && NS.BattleSystem.dealsDamage(s);
      })[0];
      if (!allEnemySkill) return { ok: true, lines: ["全体攻撃の技が無いので飛ばした"] };

      var attacker = new NS.MonsterInstance("slime", 30, gd, {});
      attacker.currentPp = 0;
      var front = new NS.MonsterInstance("slime", 30, gd, {}), guard = new NS.MonsterInstance("iwagoro" in gd.monsters ? "iwagoro" : "slime", 30, gd, {});
      var sys = new NS.BattleSystem(gd, { next: function () { return 0.5; }, nextInt: function (a) { return a; }, pick: function (x) { return x[0]; } });
      sys.start([attacker], [front, guard]);
      guard._covering = true;
      var hpFront = front.currentHp, hpGuard = guard.currentHp;
      var events = [];
      sys._performSkillOnAll(attacker, sys.getFieldEnemies().slice(), allEnemySkill, "ally", events);
      var ok = front.currentHp === hpFront && guard.currentHp < hpGuard;
      return { ok: ok, lines: [
        (ok ? "" : "✗ ") + gd.skills[allEnemySkill].name + "（PP 0）→ 通常攻撃：先頭 " + hpFront + " → " + front.currentHp +
        "・立ち塞がる側 " + hpGuard + " → " + guard.currentHp + "（立ち塞がる側だけ減るはず）"
      ] };
    }

    // --- 乱数で戦闘を回す ---
    function checkBattleFuzz(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var R = new NS.Random(777);
      var species = Object.keys(gd.monsters);
      var gear = { weapon: [], armor: [], accessory: [] };
      Object.keys(gd.items).forEach(function (id) { var e = gd.items[id].equip; if (e && gear[e.slot]) gear[e.slot].push(id); });
      var tl = ((gd.battle || {}).tactics || {}).list || [];
      var tacticIds = Array.isArray(tl) ? tl.map(function (t) { return t.id; }) : Object.keys(tl);
      var bosses = Object.keys(gd.bosses || {});
      var fmt = new NS.BattleMessageFormatter(gd.messages, gd.statuses, gd.elements);
      var problems = {}, battles = 0, turns = 0, results = {};
      function pick(a) { return a[Math.floor(R.next() * a.length)]; }
      function bad(key, detail) { if (!problems[key]) problems[key] = { count: 0, ex: detail }; problems[key].count++; }
      function makeBoss(boss) {
        var e = NS.MonsterInstance.create(boss.species, boss.level, gd, R);
        if (e.useEnemySkills) e.useEnemySkills();
        if (e.setEncounterMultipliers) e.setEncounterMultipliers(boss.statMultiplier);
        if (e.setActionPattern) e.setActionPattern(boss.actionPattern);
        if (boss.infinitePp) e.infinitePp = true;
        if (boss.actionsPerTurn) e.actionsPerTurn = boss.actionsPerTurn;
        return e;
      }
      function checkMon(m) {
        var name = (gd.monsters[m.speciesId] || {}).name, hp = m.currentHp, mx = m.getMaxHp(), pp = m.currentPp, mp = m.getMaxPp();
        if (!Number.isInteger(hp) || hp < 0 || hp > mx) bad("HP が範囲の外", name + " " + hp + "/" + mx);
        if (!Number.isInteger(pp) || pp < 0 || pp > mp) bad("PP が範囲の外", name + " " + pp + "/" + mp);
        if (m.isFainted() !== (hp === 0)) bad("倒れたと HP 0 が食い違う", name + " HP " + hp);
        (m.modifiers || []).forEach(function (x) { if (!(x.remaining > 0)) bad("強化・弱体の残りが 0 以下", name + " " + x.id); });
      }
      for (var b = 0; b < 300; b++) {
        try {
          var lv = 1 + Math.floor(R.next() * 80), allies = [];
          for (var i = 0, n = 1 + Math.floor(R.next() * 6); i < n; i++) {
            var sp = pick(species), eq = [];
            if (R.next() < 0.7) eq.push(pick(gear.weapon));
            if (R.next() < 0.7) eq.push(pick(gear.armor));
            if (R.next() < 0.6) eq.push(pick(gear.accessory));
            var m = new NS.MonsterInstance(sp, sp === "shinigami" ? 1 : lv, gd, { equipment: eq });
            m.tactic = pick(tacticIds);
            allies.push(m);
          }
          var enemies = [];
          if (R.next() < 0.25 && bosses.length) enemies.push(makeBoss(gd.bosses[pick(bosses)]));
          else for (var j = 0, ne = 1 + Math.floor(R.next() * 3); j < ne; j++) {
            var en = NS.MonsterInstance.create(pick(species), Math.max(1, lv + Math.floor(R.next() * 10) - 5), gd, R);
            if (en.useEnemySkills) en.useEnemySkills();
            enemies.push(en);
          }
          var sys = new NS.BattleSystem(gd, R);
          sys.onNonSkillAction = function (step) {
            if (step.action.type === "swap" && !sys.replaceSlot(step.actor, step.action.incoming)) bad("交代できなかった", "");
          };
          sys.start(allies, enemies);
          battles++;
          var turn = 0;
          while (!sys.finished && turn < 150) {
            turn++; turns++;
            var slots = sys.getFieldSlots(), used = [];
            var bench = allies.filter(function (x) { return slots.indexOf(x) < 0 && !x.isFainted(); });
            var acts = slots.map(function (x) {
              var free = bench.filter(function (y) { return used.indexOf(y) < 0; });
              if (x.isFainted()) {
                if (free.length && R.next() < 0.8) { var inc = pick(free); used.push(inc); return { type: "swap", incoming: inc }; }
                return { type: "skip" };
              }
              var r = R.next();
              if (r < 0.55) return { type: "tactic" };
              if (r < 0.80) return { type: "skill", skillId: pick(x.skills.concat([sys.getNormalAttackId()])), targetIndex: Math.floor(R.next() * 3) };
              if (r < 0.88) return { type: "defend" };
              if (r < 0.95 && free.length) { var inc2 = pick(free); used.push(inc2); return { type: "swap", incoming: inc2 }; }
              return { type: "skip" };
            });
            var ev = sys.takeTurn(acts);
            fmt.annotate(ev);
            ev.forEach(function (e) {
              var txt;
              try { txt = fmt.formatOne(e); } catch (err) { bad("文を作るところで止まった：" + e.type, err.message); return; }
              [txt, e.logText].forEach(function (t) {
                if (typeof t === "string" && /undefined|NaN|null|\{[a-z]+\}/.test(t)) bad("文がおかしい：" + e.type, t);
              });
            });
            allies.concat(enemies).forEach(checkMon);
            var seen = [];
            sys.getFieldSlots().forEach(function (x) {
              if (allies.indexOf(x) < 0) bad("枠に仲間でない者", "");
              if (seen.indexOf(x) >= 0) bad("枠に同じ仲間が2回", "");
              seen.push(x);
            });
          }
          if (!sys.finished) bad("150 ターンで終わらない", "");
          results[sys.result] = (results[sys.result] || 0) + 1;
        } catch (err) {
          bad("止まった：" + err.message, (err.stack || "").split("\n").slice(0, 3).join(" | "));
        }
      }
      var keys = Object.keys(problems);
      var lines = [battles + " 戦・" + turns + " ターン（" + Object.keys(results).map(function (k) { return k + " " + results[k]; }).join("・") + "）"];
      keys.forEach(function (k) { lines.push("✗ " + k + "（" + problems[k].count + " 回）" + (problems[k].ex ? "：" + problems[k].ex : "")); });
      return { ok: keys.length === 0, lines: lines };
    }

    // --- 図鑑（見開きの本） ---
    function checkDex(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var canvas = document.createElement("canvas");
      canvas.width = 800; canvas.height = 600;
      var g2 = canvas.getContext("2d");

      // 画面に書いた文字をぜんぶ拾う
      var drawn = [], badTexts = [];
      var fill = g2.fillText;
      g2.fillText = function (s) {
        s = String(s);
        drawn.push(s);
        if (/undefined|NaN|null|\[object/.test(s) && badTexts.length < 8) badTexts.push(s);
        return fill.apply(g2, arguments);
      };

      var ids = Object.keys(gd.monsters);
      var pressed = {};
      var input = {
        isPressed: function (a) { return !!pressed[a]; },
        isDown: function () { return false; },
        getPointer: function () { return { x: -1, y: -1, inside: false, clicked: false, wheel: 0, moved: false, down: false }; }
      };
      var cleared = {};
      Object.keys(gd.dungeons || {}).forEach(function (k) { cleared[k] = true; });

      function makeScene(mode) {
        var d = new NS.Discovery();
        ids.forEach(function (id) {
          if (mode === "seen") d.markMonsterSeen(id);
          if (mode === "all") { d.markMonsterCaught(id); d.markAffectionStage(id, 3); }
        });
        if (mode === "all") {
          Object.keys(gd.items).forEach(function (id) { d.markItemObtained(id); });
          Object.keys(gd.skills).forEach(function (id) { d.markSkillLearned(id); });
        }
        var game = {
          ctx: g2, canvas: canvas, data: gd, assets: null, clock: 0, input: input, discovery: d,
          inventory: { getCount: function () { return 0; } }, clearedDungeons: cleared,
          scenes: { change: function () {} },
          hasBoughtBlessing: function () { return mode === "all"; }
        };
        return new NS.DexScene(game, null);
      }
      function step(scene, action) {
        pressed = {};
        if (action) pressed[action] = true;
        scene.game.clock += 16;
        scene.update();
        pressed = {};
        scene.render(g2);
      }

      var lines = [], ok = true, pages = 0;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }
      var tabCount = 6;
      var leaks = { none: [], seen: [], other: [] }, wide = [], manyDrops = [];

      ["none", "seen", "all"].forEach(function (mode) {
        var scene = makeScene(mode);
        var view = scene._pageView(), geo = scene._geo();
        var widthLimit = view.x + view.w - geo.lx;

        // モンスターの表：ぜんぶめくる。1体ごとに、落とすものの続きと文の送りも押す
        for (var i = 0; i < ids.length; i++) {
          drawn = [];
          step(scene, null);
          step(scene, "confirm");
          step(scene, "down");
          var id = scene.monsterId, m = gd.monsters[id];
          var all = drawn.join("\n");
          if (mode === "none" && all.indexOf(m.name) >= 0) leaks.none.push(m.name);
          if (mode === "seen") {
            var head = (m.description || "").slice(0, 8);
            if (head && all.indexOf(head) >= 0) leaks.seen.push(m.name);
          }
          if (mode === "all") {
            g2.font = (gd.ui.theme || {}).smallFont || "12px monospace";
            scene._pageLines().forEach(function (line) {
              if (line.text && g2.measureText(line.text).width > widthLimit) wide.push(m.name + "「" + line.text + "」");
            });
            scene._dropPages(id).forEach(function (p) { if (p.drops.length > 3) manyDrops.push(m.name); });
          }
          pages++;
          step(scene, "right");
        }
        expect(scene.monsterId === scene.monsterIds[0], modeName(mode) + "：モンスター " + ids.length + " 体をめくって、最初のページに戻った");

        // 並べ替えをひと回り
        for (var s = 0; s < 4; s++) step(scene, "sort");

        // ほかの表：栞を送り、一覧を下まで送る。説明が長ければ読むところへ入って出る
        drawn = [];
        for (var t = 1; t < tabCount; t++) {
          step(scene, "nextTab");
          var rows = scene.list.rows.length;
          for (var r = 0; r < rows; r++) {
            step(scene, "down");
            if (r % 7 === 0) { step(scene, "confirm"); step(scene, "down"); step(scene, "cancel"); }
            pages++;
          }
          if (scene._hasSort()) step(scene, "sort");
        }
        if (mode === "none") {
          var otherText = drawn.join("\n");
          ids.forEach(function (id) {
            var name = gd.monsters[id].name;
            if (name && otherText.indexOf(name) >= 0 && leaks.other.indexOf(name) < 0) leaks.other.push(name);
          });
        }
        step(scene, "nextTab");
        expect(scene.getTab() === "monsters", modeName(mode) + "：栞を6つ送って、モンスターの表に戻った");
      });

      expect(badTexts.length === 0, "文に undefined や NaN が出ない" + (badTexts.length ? "（出た：" + badTexts.join(" / ") + "）" : ""));
      expect(leaks.none.length === 0, "まだ出会っていない相手の名前は出ない" + (leaks.none.length ? "（出た：" + leaks.none.slice(0, 5).join("・") + "）" : ""));
      expect(leaks.other.length === 0, "何も分かっていないとき、アイテム・特性・技などの説明にもモンスターの名前は出ない" + (leaks.other.length ? "（出た：" + leaks.other.slice(0, 5).join("・") + "）" : ""));
      expect(leaks.seen.length === 0, "出会っただけの相手の説明は出ない" + (leaks.seen.length ? "（出た：" + leaks.seen.slice(0, 5).join("・") + "）" : ""));
      expect(wide.length === 0, "左のページの文がページの幅に収まる" + (wide.length ? "（はみ出す：" + wide.slice(0, 3).join(" ") + "）" : ""));
      expect(manyDrops.length === 0, "落とすものは1度に3つまで" + (manyDrops.length ? "（多い：" + manyDrops.join("・") + "）" : ""));
      lines.unshift("何も分かっていない・出会っただけ・ぜんぶ分かった、の3つの進み具合で " + pages + " ページを描いた");
      return { ok: ok, lines: lines };

      function modeName(mode) { return mode === "none" ? "何も分かっていない" : mode === "seen" ? "出会っただけ" : "ぜんぶ分かった"; }
    }

    // --- 工房の右の説明（v1.4.0） ---
    function checkCraft(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var canvas = document.createElement("canvas");
      canvas.width = 800; canvas.height = 600;
      var g2 = canvas.getContext("2d");

      var drawn = [], badTexts = [];
      var fill = g2.fillText;
      g2.fillText = function (s) {
        s = String(s);
        drawn.push(s);
        if (/undefined|NaN|null|\[object/.test(s) && badTexts.length < 8) badTexts.push(s);
        return fill.apply(g2, arguments);
      };

      var pressed = {};
      var IDLE = { x: -1, y: -1, inside: false, clicked: false, wheel: 0, moved: false, down: false };
      var pointer = IDLE;
      var input = {
        isPressed: function (a) { return !!pressed[a]; },
        isDown: function () { return false; },
        getPointer: function () { return pointer; }
      };
      var cleared = {};
      Object.keys(gd.dungeons || {}).forEach(function (k) { cleared[k] = true; });
      var ids = Object.keys(gd.monsters);

      function makeScene(mode) {
        var d = new NS.Discovery();
        if (mode === "all") {
          ids.forEach(function (id) { d.markMonsterCaught(id); });
          Object.keys(gd.items).forEach(function (id) { d.markItemObtained(id); });
        }
        // 素材は「何も持っていない」（どの素材の下にも手に入る場所が出る）か「たくさん持っている」
        var many = (mode === "rich");
        var game = {
          ctx: g2, canvas: canvas, data: gd, assets: null, clock: 0, input: input, discovery: d,
          inventory: { getCount: function () { return many ? 99 : 0; } },
          clearedDungeons: cleared, gold: many ? 99999 : 0,
          canAfford: function (n) { return many || n <= 0; },
          audio: { playBgm: function () {}, playSe: function () {} },
          playError: function () {},
          scenes: { change: function () {} }
        };
        return new NS.CraftScene(game, null);
      }
      function step(scene, action) {
        pressed = {};
        if (action) pressed[action] = true;
        scene.game.clock += 16;
        scene.update(16);
        pressed = {};
        scene.render(g2);
      }

      var lines = [], ok = true, pages = 0, leaks = [], wide = [], noSources = 0, openedEarly = 0, notOpened = 0;
      function sourceRows(content) {
        return content.lines.filter(function (l) { return l.sprite || l.unknownSprite || l.icon === "iconShop" || l.icon === "iconCraft"; }).length;
      }
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }

      ["none", "all", "rich"].forEach(function (mode) {
        var scene = makeScene(mode);
        var rect = scene.layout.detail;
        var origin = scene.panel.innerOrigin(rect);
        var rows = scene.list.rows.length;
        for (var r = 0; r < rows; r++) {
          drawn = [];
          step(scene, null);
          var content = scene._detailContent();
          if (content) {
            // はじめは閉じている。C で開く（開いたかは「▼」の行で見る）
            scene.game.craftOpenSources = {};
            scene._detailCache = null;
            content = scene._detailContent();
            if (sourceRows(content) > 0) openedEarly++;
            var missing = scene._hasMissing();
            step(scene, "menu");
            content = scene._detailContent();
            if (missing && !content.lines.some(function (l) { return l.toggle && /^▼/.test(l.text || ""); })) notOpened++;
            // 説明をバーの端まで送って戻す
            var m = scene.pane.measure();
            if (m.total > m.visible) {
              scene.pane.scroll = m.total - m.visible;
              step(scene, null);
              scene.pane.scroll = 0;
            }
            for (var k = 0; k < 3; k++) step(scene, "nextTab");
            step(scene, "prevTab");
            // 手に入る場所の「相手」の行（説明の文に名前が出るのは作者の文なので数えない）
            if (mode === "none") {
              content.lines.forEach(function (line) {
                if (!line.sprite && !line.unknownSprite) return;
                ids.forEach(function (id) {
                  var name = gd.monsters[id].name;
                  if (name && (line.text || "").indexOf(name) >= 0 && leaks.indexOf(name) < 0) leaks.push(name);
                });
                if (line.sprite && leaks.indexOf("絵") < 0) leaks.push("絵");
              });
            }
            if (mode === "rich" && content.lines.some(function (l) { return l.toggle; })) noSources++;
            g2.font = (gd.ui.theme || {}).smallFont || "12px monospace";
            content.lines.forEach(function (line) {
              var x = origin.x + (line.indent || 0) + ((line.sprite || line.unknownSprite) ? 24 : line.icon ? 22 : 0);
              var w = line.text ? g2.measureText(line.text).width : 0;
              var limit = rect.x + rect.w - 24 - (line.right ? g2.measureText(line.right).width + 8 : 0);
              if (x + w > limit && wide.length < 5) wide.push("「" + line.text + "」");
            });
            pages++;
          }
          step(scene, "down");
        }
        step(scene, "filter");
      });

      // マウス：「▶ 手に入る場所」を押すと開く／バーのつまみを下までずらすと最後まで送れる
      var mouse = makeScene("none");
      mouse.game.craftOpenSources = {};
      var clickOk = false, dragOk = false, longest = null;
      for (var mr = 0; mr < mouse.list.rows.length; mr++) {
        if (!mouse.list.rows[mr].value) continue;
        mouse.list.setIndex(mr);
        step(mouse, null);
        var hit = (mouse.pane.hits || [])[1];   // 1つめの素材の「▶ 手に入る場所」
        if (!hit) continue;
        pointer = { x: hit.rect.x + 20, y: hit.rect.y + 8, inside: true, clicked: true, wheel: 0, moved: false, down: false };
        step(mouse, null);
        pointer = IDLE;
        step(mouse, null);
        clickOk = !!mouse.game.craftOpenSources[hit.id];
        break;
      }
      // いちばん長いレシピで、つまみを下へずらす
      mouse.game.craftOpenSources = new Proxy({}, { get: function () { return true; } });
      for (var lr = 0; lr < mouse.list.rows.length; lr++) {
        if (!mouse.list.rows[lr].value) continue;
        mouse.list.setIndex(lr);
        mouse._detailCache = null;
        step(mouse, null);
        var mm = mouse.pane.measure();
        if (mm.total > mm.visible && (!longest || mm.total > longest.total)) longest = { row: lr, total: mm.total };
      }
      if (longest) {
        mouse.list.setIndex(longest.row);
        mouse._detailCache = null;
        step(mouse, null);
        var m2 = mouse.pane.measure();
        var track = mouse.pane.barRect(m2), handle = mouse.pane.handleRect(track, m2);
        var gx = track.x + 3, gy = handle.y + 4;
        pointer = { x: gx, y: gy, inside: true, clicked: false, wheel: 0, moved: true, down: true };
        step(mouse, null);
        pointer = { x: gx, y: track.y + track.h + 40, inside: true, clicked: false, wheel: 0, moved: true, down: true };
        step(mouse, null);
        pointer = { x: gx, y: track.y + track.h + 40, inside: true, clicked: true, wheel: 0, moved: false, down: false };
        step(mouse, null);
        pointer = IDLE;
        dragOk = mouse.pane.scroll === m2.total - m2.visible;

      function width(text, font) { g2.font = font; return g2.measureText(text).width; }

      var count = settings.items.length;
      var boxW = I.w, innerX = I.x + pad, right = I.x + boxW - pad;
      var barX = innerX + 18 + (I.labelWidth || 112);

      settings.items.forEach(function (item) {

        if (item.type === "action") return;
        var original = settings.get(item.id);
        for (var v = item.min; v <= item.max; v += item.step || 1) {
          settings.values[item.id] = v;
          var text = settings.formatValue(item.id);
          var end = barX + I.barWidth + 12 + width(text, t.smallFont) + 6 + width("▶", t.smallFont);
          if (end > right && bad.length < 5) bad.push(item.label + "「" + text + "」");
          values++;
        }
        settings.values[item.id] = original;
        var desc = NS.wrapText(item.description || "", A.charsPerLine || 27);
        var need = 14 + (A.lineHeight || 17) + 2 + desc.length * (A.lineHeight || 17) - (A.lineHeight || 17);
        if (pad + need > (A.h || 84) - 4 && bad.length < 5) bad.push("説明「" + item.label + "」が " + desc.length + " 行");

      });

      expect(bad.length === 0, "名前・値・説明・キーが枠に収まり、重ならない" + (bad.length ? "（" + bad.join(" / ") + "）" : ""));

    // --- お店の絞り込み（v1.4.0） ---
    function checkShopFilter(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var env = checkSceneEnv(NS, gd), game = env.game;
      var scene = new NS.ShopScene(game, null);
      var lines = [], ok = true;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }
      var T = scene.layout.tabs, L = scene.layout.list;
      var tabsRight = T.x + T.w * 2 + T.gap;
      var combos = 0, tried = 0, empty = [], sums = [], overlap = [], sources = 0;
      var BASE = ["use", "weapon", "armor", "accessory", "material"];

      for (var sh = 0; sh < scene.shops.length; sh++) {
        for (var tab = 0; tab < 2; tab++) {
          if (scene.filters) {
            combos++;
            var counts = {};
            scene.filters.forEach(function (f) {
              game.shopFilter = f;
              scene._rebuildList();
              scene.render(env.g2);
              tried++;
              var n = env.entries(scene).length;
              counts[f] = n;
              if (f.indexOf("from:") === 0) sources++;
              if (n === 0 && empty.length < 5) empty.push(scene._filterName(f));
              var r = scene._filterRect;
              if (!r || r.x < tabsRight + 4 || r.x + r.w > L.x + L.w + 10) {
                if (overlap.length < 3) overlap.push(scene._filterName(f));
              }
            });
            var parts = BASE.reduce(function (sum, f) { return sum + (counts[f] || 0); }, 0);
            var fromSum = scene.filters.filter(function (f) { return f.indexOf("from:") === 0; })
              .reduce(function (sum, f) { return sum + counts[f]; }, 0);
            if (parts !== counts.all && sums.length < 3) sums.push("分類の合計 " + parts + " ≠ すべて " + counts.all);
            if (fromSum > (counts.material || 0) && sums.length < 3) sums.push("場所の合計 " + fromSum + " > 素材 " + counts.material);
            game.shopFilter = "all";
            scene._rebuildList();
          }
          env.step(scene, "right");
        }
        env.step(scene, "nextTab");
      }

      expect(env.badTexts.length === 0, "文に undefined や NaN が出ない" + (env.badTexts.length ? "（出た：" + env.badTexts.join(" / ") + "）" : ""));
      expect(empty.length === 0, "札に出る絞り込みは、どれも1つ以上の品が残る" + (empty.length ? "（空：" + empty.join(" / ") + "）" : ""));
      expect(sums.length === 0, "回復・道具／武器／防具／アクセサリー／素材を合わせると「すべて」と同じ数" + (sums.length ? "（" + sums.join(" / ") + "）" : ""));
      expect(sources > 0, "素材の手に入る場所でも絞り込める（" + sources + " 通り）");
      expect(overlap.length === 0, "絞り込みの札が、買う・売るのタブと重ならず一覧の幅に収まる" + (overlap.length ? "（" + overlap.join(" / ") + "）" : ""));
      lines.unshift("お店 " + scene.shops.length + " 軒・" + combos + " 通りの一覧で、絞り込みを " + tried + " 回切り替えた");
      return { ok: ok, lines: lines };
    }

    // --- 加護を選ぶ（v1.4.0） ---
    function checkBlessingSelect(ctx) {

        });

        if (f === "on" || f === "off") onOff += rows.length;

      // 入れる・外すを押しても、絞り込みの中で選んでいる場所が飛ばない

      for (var k = 0; k < 4; k++) {

        env.step(scene, "confirm");
        if (game.isBlessingActive(before) !== was) toggled++;
        if (scene.list.getSelected() && scene.list.getSelected().value === before) keepFocus++;
      }

      expect(env.badTexts.length === 0, "文に undefined や NaN が出ない" + (env.badTexts.length ? "（出た：" + env.badTexts.join(" / ") + "）" : ""));

    // --- ダンジョンを選ぶ（v1.4.0） ---
    function checkDungeonSelect(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var env = checkSceneEnv(NS, gd), game = env.game, g2 = env.g2;
      var lines = [], ok = true;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }
      var t = gd.ui.theme || {};
      var rect = (gd.ui.dungeonSelect || {}).detail;
      var pad = t.padding || 8;
      var wide = [], counts = [], fits = [], pages = 0;
      var allIds = Object.keys(gd.dungeons || {});
      var monsterIds = Object.keys(gd.monsters);

      // 何もクリアしていない／半分／全部、見た記録も 無し／一部／全部 で描く
      var states = [
        { cleared: [], seen: 0 },
        { cleared: allIds.slice(0, Math.ceil(allIds.length / 2)), seen: 2 },
        { cleared: allIds, seen: 1 }
      ];
      states.forEach(function (state) {
        game.clearedDungeons = {};
        state.cleared.forEach(function (id) { game.clearedDungeons[id] = true; });
        game.discovery = new NS.Discovery();
        monsterIds.forEach(function (id, i) { if (state.seen === 1 || (state.seen === 2 && i % 2)) game.discovery.markMonsterSeen(id); });
        Object.keys(gd.items).forEach(function (id, i) { if (state.seen === 1 || (state.seen === 2 && i % 2)) game.discovery.markItemObtained(id); });

        var scene = new NS.DungeonSelectScene(game, null);
        function measure(content) {
          if (!content) return;
          pages++;
          g2.font = "18px monospace";
          var headX = rect.x + pad + 72;
          var chipW = (content.head.chips || []).reduce(function (sum, c) {
            g2.font = t.smallFont || "12px monospace";
            return sum + Math.ceil(g2.measureText(c.label).width) + 14 + 6;
          }, 0);
          if (headX + chipW > rect.x + rect.w - pad && wide.length < 5) wide.push("札「" + content.head.name + "」");
          g2.font = t.smallFont || "12px monospace";
          content.lines.forEach(function (line) {
            var x = rect.x + pad + (line.indent || 0) + ((line.sprite || line.unknownSprite) ? 24 : line.icon ? 22 : 0);
            var w = line.text ? g2.measureText(line.text).width : 0;
            var limit = rect.x + rect.w - 24 - (line.right ? g2.measureText(String(line.right)).width + 8 : 0);
            if (x + w > limit && wide.length < 5) wide.push("「" + (line.text || "") + "／" + (line.right || "") + "」");
          });
        }
        // 穴の段と区画の段を、すべて回る
        for (var r = 0; r < scene.regions.length; r++) {
          scene.phase = "region";
          scene.regionIndex = r;
          scene.render(g2);
          measure(scene._detailContent());
          var region = scene.regions[r];
          if (!scene.isRegionUnlocked(region)) continue;
          scene._openRegion(r, false);
          for (var d = 0; d < scene.dungeons.length; d++) {
            scene.index = d;
            scene.render(g2);
            var content = scene._detailContent();
            measure(content);
            var dungeon = scene.dungeons[d];
            if (!scene.isUnlocked(dungeon) || dungeon.ready === false) continue;
            var species = NS.DungeonCatalog.getSpecies(gd, dungeon).length;
            var drops = NS.DungeonCatalog.getDropItems(gd, dungeon, game.isDungeonCleared(dungeon.id)).length;
            // はじめ（たたんだまま）は送らなくても1画面に収まる
            game.dungeonListsOpen = {};
            scene.pane.setContent(scene._detailContent(), "closed:" + dungeon.id);
            var m = scene.pane.measure();
            if (m.total > m.visible && fits.length < 3) fits.push(dungeon.name + "（" + m.total + "/" + m.visible + " 行）");
            // 開くと、出現するモンスター・手に入るものが全部並ぶ
            game.dungeonListsOpen = { monsters: true, items: true };
            var openLines = scene._detailContent().lines.filter(function (l) { return l.sprite || l.unknownSprite || l.icon; }).length;
            if (openLines < species + drops && counts.length < 3) counts.push(dungeon.name + "（開いて " + openLines + " 行）");
            game.dungeonListsOpen = {};
            var monsterLines = scene._monsterLines(dungeon).lines.length;
            var itemLines = scene._itemLines(dungeon, game.isDungeonCleared(dungeon.id)).lines.length;
            if ((monsterLines !== species || itemLines !== Math.max(1, drops)) && counts.length < 3) {
              counts.push(dungeon.name + "（モンスター " + monsterLines + "/" + species + "・品 " + itemLines + "/" + drops + "）");
            }
          }
        }
      });

      expect(env.badTexts.length === 0, "文に undefined や NaN が出ない" + (env.badTexts.length ? "（出た：" + env.badTexts.join(" / ") + "）" : ""));
      expect(counts.length === 0, "出現するモンスター・手に入るものが、1つずつ漏れなく並ぶ" + (counts.length ? "（" + counts.join(" / ") + "）" : ""));
      expect(wide.length === 0, "右の文と札が枠の幅に収まる" + (wide.length ? "（はみ出す：" + wide.join(" ") + "）" : ""));
      expect(fits.length === 0, "はじめ（モンスターと品は2つずつ）は、送らなくても区画の説明が1画面に収まる" + (fits.length ? "（入りきらない：" + fits.join(" / ") + "）" : ""));
      lines.unshift("クリアの進み 3 通りで、穴と区画の説明を " + pages + " 件描いた");
      return { ok: ok, lines: lines };
    }

        var scene = new NS.PlayerSetupScene(game, {}, mode);
        scene.enter();
        var L = scene.layout, B = L.preview;
        // すべての欄を回って描く（文字が欠けない・下のひと言が枠や戻るボタンにかからない）
        var back = ((gd.ui.theme || {}).backButton || {}).x || 688;
        for (var i = 0; i < scene.rows.length; i++) {
          env.step(scene, null);
          var kind = scene._rowKind();
          if (kind === "done") kind = (mode === "new") ? "doneNew" : "doneEdit";
          var text = (scene.texts.descriptions || {})[kind] || "";
          if (!text) wide.push("ひと言が無い：" + kind);
          var limit = (mode === "edit") ? back - 12 : 800 - 24;
          if (L.description.x + w(text, L.description.font) > limit) wide.push("ひと言「" + text + "」");
          env.step(scene, "down");
        }
        var hint = (mode === "new") ? scene.texts.hintNew : scene.texts.hintEdit;
        if (L.hint.x + w(hint) > ((mode === "edit") ? back - 12 : 800 - 24)) wide.push("案内「" + hint + "」");
        // 欄は左の姿の枠の下端より上で終わる・下のひと言より上
        var last = scene._doneRect();
        results[mode + "Bottom"] = last.y + last.h;
        if (last.y + last.h > B.boxY + B.boxH + 2 || last.y + last.h > L.description.y - 14) wide.push("欄が下にはみ出す（" + (last.y + last.h) + "）");
        // 色の欄の右端の名前が、いちばん右の見本にかからない（いちばん長い名前・色コード）
        ["hairColor", "color", "pants"].forEach(function (k) {
          var p = scene.palettes[k], row = scene._rowRect(scene.rows.indexOf(k));
          var end = scene._optionRect(k, p.customIndex);
          var longest = "#FFFFFF";
          p.list.forEach(function (c) { if (w(c.name) > w(longest)) longest = c.name; });
          if (row.x + row.w - 12 - w(longest) < end.x + end.w + 6) wide.push(k + " の名前「" + longest + "」が見本にかかる");
        });
        // 向きの札が左の枠に収まる
        env.step(scene, null);
        var fr = scene._facingRects;
        if (fr.length && (fr[0].x < B.boxX + 4 || fr[fr.length - 1].x + fr[fr.length - 1].w > B.boxX + B.boxW - 4)) wide.push("向きの札が枠からはみ出す");
        results[mode + "Facing"] = fr.length;
      });

      // Q/E で向きが回る・R は名前と性別と一人称を変えない
      var s = new NS.PlayerSetupScene(game, {}, "new");
      s.enter();
      env.step(s, null);
      var start = s.facing;
      env.step(s, "nextTab");
      var turned = s.facing !== start && s._facingDir() === "down";
      env.step(s, "prevTab");
      var back2 = s.facing === start;
      s.genderIndex = 1; s.firstPersonIndex = 2;
      var before = { g: s.genderIndex, f: s.firstPersonIndex, n: s.name };
      var changed = false, ref = JSON.stringify(s._selection());
      for (var k = 0; k < 6; k++) { env.step(s, "sort"); if (JSON.stringify(s._selection()) !== ref) changed = true; }
      var kept = s.genderIndex === before.g && s.firstPersonIndex === before.f && s.name === before.n;

      expect(env.badTexts.length === 0, "文に undefined や NaN が出ない" + (env.badTexts.length ? "（出た：" + env.badTexts.join(" / ") + "）" : ""));
      expect(wide.length === 0, "ひと言・案内・色の名前・向きの札が、枠や戻るボタンにかからない" + (wide.length ? "（" + wide.join(" / ") + "）" : ""));
      expect(results.newFacing === 5 && results.editFacing === 5, "左の姿の下に向きの札が5つ（↓ ← ↑ → 自動）");
      expect(turned && back2, "Q / E で向きが回り、もとへ戻せる");
      expect(changed && kept, "R のおまかせで見た目が変わり、名前・性別・一人称は変わらない");
      lines.unshift("新規・変更の2通りで、" + s.rows.length + " 欄を回して描いた（欄の下端 " + results.newBottom + "）");
      return { ok: ok, lines: lines };
    }

    // --- 戦闘：技の効き目の印・範囲の札・戦闘のログ（v1.4.0） ---
    function checkBattleMarks(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var env = checkSceneEnv(NS, gd), game = env.game, g2 = env.g2;
      var t = gd.ui.theme || {};
      var lines = [], ok = true, wide = [];
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }
      function w(text, font) { g2.font = font || t.smallFont || "12px monospace"; return g2.measureText(text).width; }

      // 水の技を持つスライムで、水に弱いスミビ・水に強いキングスライムと戦う
      var party = new NS.Party(6);
      party.add(new NS.MonsterInstance("slime", 20, gd, {}));
      game.party = party;
      game.discovery = new NS.Discovery();
      var weakFoe = new NS.MonsterInstance("cinderling", 20, gd, {});
      var strongFoe = new NS.MonsterInstance("kingSlime", 20, gd, {});
      var scene = new NS.BattleScene(game, party, [weakFoe, strongFoe], {}, function () {}, {});
      var aqua = gd.getSkill("aqua"), tackle = gd.getSkill("tackle");
      // 盤面に敵が並ぶのは戦いが始まってから
      if (scene.enter) scene.enter();
      for (var f = 0; f < 3; f++) env.step(scene, null);

      // スカウトしていない相手には出さない → スカウトしたら出る
      var hiddenBefore = scene._effectOf(aqua, weakFoe) === null && scene._effectOf(aqua, strongFoe) === null;
      game.discovery.markMonsterCaught("cinderling");
      game.discovery.markMonsterCaught("kingSlime");
      var shown = scene._effectOf(aqua, weakFoe) === "weak" && scene._effectOf(aqua, strongFoe) === "resist";
      var plain = scene._effectOf(tackle, weakFoe) === null;
      var listMark = scene._weakAgainstField(aqua) === true;

      // 範囲の札：すべての技の target に名前があり、威力の行と重ならない
      var labels = scene.texts.targetLabels || {}, missing = [];
      var info = gd.ui.battle, left = info.message.x + (t.padding || 8);
      var right = (info.skillMenu || info.subMenu).x - ((info.rangeChip || {}).marginRight || 10);
      Object.keys(gd.skills).forEach(function (id) {
        var s = gd.skills[id];
        var range = labels[s.target || "enemy"];
        if (!range) { if (missing.indexOf(s.target) < 0) missing.push(s.target); return; }
        var stats = (NS.BattleSystem.dealsDamage(s) ? scene.texts.skillStats : scene.texts.skillStatsNoPower)
          .replace("{power}", gd.formatSkillPower(s)).replace("{accuracy}", "100").replace("{pp}", "99");
        if (left + w(stats) + 8 > right - (w(range) + 10) && wide.length < 4) wide.push("範囲の札「" + s.name + "」");
      });

      // ログ：見せた行が残る・その場の知らせは残らない・長い行は折り返す・開け閉めで元の状態へ
      var log = scene.messageLog;
      var start = log.history.length;
      log.push("テストの文"); log.advance();
      scene.phase = "command";
      scene._flashMessage("PPが足りない!");
      log.push("あ".repeat(120)); log.advance();
      var kept = log.history.some(function (h) { return h.text === "テストの文"; });
      var quiet = !log.history.some(function (h) { return h.text === "PPが足りない!"; });
      var rows = scene._logRows();
      var maxRow = 0;
      rows.forEach(function (r) { if (r.text) maxRow = Math.max(maxRow, w(r.text, t.font)); });
      var L = gd.ui.battle.log;
      if (L.x + 28 + maxRow > L.x + L.w - 20) wide.push("ログの行の幅");
      if (L.x + 20 + w(scene.texts.logHint) > L.x + L.w - 12) wide.push("ログの案内");
      scene.phase = "turnMenu";
      env.pressed = { menu: true }; scene._updateTurnMenu(game.input); env.pressed = {};
      var opened = scene.phase === "log";
      scene.render(g2);
      env.pressed = { cancel: true }; scene._updateLog(game.input); env.pressed = {};
      var closed = scene.phase === "turnMenu";
      scene._buildTurnMenu();
      var hasItem = scene.commandMenu.items.some(function (i) { return i.value === "log"; });

      expect(env.badTexts.length === 0, "文に undefined や NaN が出ない" + (env.badTexts.length ? "（出た：" + env.badTexts.join(" / ") + "）" : ""));
      expect(hiddenBefore && shown && plain, "効き目はスカウトした相手だけ・水の技はスミビに◎ キングスライムに△・無属性の体当たりには出ない");
      expect(listMark, "技の一覧に、よく効く相手がいる技の ◎ が付く");
      expect(missing.length === 0, "すべての技の範囲に名前がある" + (missing.length ? "（無い：" + missing.join(" / ") + "）" : ""));
      expect(wide.length === 0, "範囲の札・ログの行・案内が、重ならず枠に収まる" + (wide.length ? "（" + wide.join(" / ") + "）" : ""));
      expect(kept && quiet && start >= 1, "ログに見せた行が残り、「PPが足りない!」のような知らせは残らない");
      expect(hasItem && opened && closed, "ターンの頭に「ログ」があり、C で開いて Esc で戻る");
      lines.unshift("技 " + Object.keys(gd.skills).length + " 個の範囲の札・ログ " + rows.length + " 行を確かめた");
      return { ok: ok, lines: lines };
    }

    // --- 体技・ちからため・即死の見直し（v1.4.1） ---
    function checkSkillReview141(ctx) {
      var NS = ctx.NS, gd = ctx.gd;
      var lines = [], ok = true;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }
      var MID = { next: function () { return 0.5; }, nextInt: function (a) { return a; }, pick: function (x) { return x[0]; } };
      function copy(o, extra) { var c = {}; for (var k in o) c[k] = o[k]; for (var e in extra) c[e] = extra[e]; return c; }
      var tackle = gd.skills.tackle, lightning = gd.skills.lightning, normal = gd.skills[gd.battle.normalAttackSkill || "normalAttack"] || gd.skills.normalAttack;

      // 1体の体技 ＝ 同じ倍率の斬撃（クリティカルが出ない乱数で比べる）
      var a = new NS.MonsterInstance("slime", 40, gd, {}), d = new NS.MonsterInstance("slime", 30, gd, {});
      var sys = new NS.BattleSystem(gd, MID);
      sys.start([a], [d]);
      var asSlash = copy(tackle, { kind: "slash" });
      var dmgBody = sys.calcDamage(a, d, tackle).damage, dmgSlash = sys.calcDamage(a, d, asSlash).damage;
      expect(dmgBody === dmgSlash && dmgBody > 0, "体当たり（1.1）＝ 倍率1.1の斬撃：" + dmgBody + " ／ " + dmgSlash);

      // 全体の体技は攻撃力・防御力によらない
      var weak = new NS.MonsterInstance("slime", 5, gd, {}), strong = new NS.MonsterInstance("slime", 60, gd, {});
      var hard = new NS.MonsterInstance("slime", 60, gd, {});
      var f1 = sys.calcDamage(weak, d, lightning).damage, f2 = sys.calcDamage(strong, d, lightning).damage, f3 = sys.calcDamage(strong, hard, lightning).damage;
      expect(f1 === f2 && f2 === f3, "いなずま（固定50）は使い手・相手のレベルで変わらない：" + [f1, f2, f3].join(" / "));
      expect(NS.BattleSystem.bodyModeOf(gd.skills.numbPowder) === null && NS.BattleSystem.bodyModeOf(gd.skills.chargeUp) === null,
        "ダメージの無い体技（しびれ粉・ちからため）は今までどおり");
      expect(gd.formatSkillPower(gd.skills.armorBreak) === "1.0" && gd.formatSkillPower(lightning) === "50",
        "威力の見せ方：鎧くずし「" + gd.formatSkillPower(gd.skills.armorBreak) + "」・いなずま「" + gd.formatSkillPower(lightning) + "」");

      // クリティカル：乱数 0 でも体技は出ない（通常攻撃は出る）
      var sys0 = new NS.BattleSystem(gd, { next: function () { return 0; }, nextInt: function (x) { return x; }, pick: function (x) { return x[0]; } });
      sys0.start([a], [d]);
      expect(sys0._rollCritical(tackle, a) === false && sys0._rollCritical(gd.skills.bodyPress, a) === false && sys0._rollCritical(normal, a) === true,
        "体技はクリティカルが出ない（通常攻撃は出る）");

      // 盲目：体当たりは受けない・ボディプレスは受ける
      var blindA = new NS.MonsterInstance("slime", 20, gd, {});
      sys.start([blindA], [d]);
      blindA.addStatus("blind", MID);
      var accT = sys._accuracyMultiplier(blindA, tackle), accP = sys._accuracyMultiplier(blindA, gd.skills.bodyPress);
      expect(accT === 1 && accP < 1, "盲目：体当たり ×" + accT + "・ボディプレス ×" + accP);

      // ちからため：乗る技・重ねがけ・消えるとき
      expect(sys._chargeApplies(normal) && sys._chargeApplies(tackle) && sys._chargeApplies(gd.skills.bite) &&
             !sys._chargeApplies(lightning) && !sys._chargeApplies(gd.skills.ember),
        "ちからため が乗るのは1体の通常攻撃・体技・斬撃だけ（いなずま・ファイアには乗らない）");
      var hero = new NS.MonsterInstance("slime", 40, gd, {}), foe = new NS.MonsterInstance("kingSlime", 40, gd, {});
      var tsys = new NS.BattleSystem(gd, MID);
      tsys.start([hero], [foe]);
      hero.currentHp = 99999; foe.currentHp = 99999; hero.currentPp = 999;
      // 相手は動かない（ダメージの比べっこを相手の強化や防御で崩さないため）
      tsys._chooseEnemyAction = function () { return { type: "skip" }; };
      function turn(id) {
        var ev = tsys.takeTurn([{ type: "skill", skillId: id, targetIndex: 0 }]);
        return ev.filter(function (e) { return e.target === hero || e.actor === hero || e.attacker === hero; }).map(function (e) { return e.type; });
      }
      var t1 = turn("chargeUp"), held1 = !!hero._charged;
      var t2 = turn("chargeUp"), failed = t2.indexOf("chargeFailed") >= 0, lost2 = t2.indexOf("chargeLost") >= 0 && !hero._charged;
      expect(held1 && t1.indexOf("chargeLost") < 0, "ためた手番のあとは残る");
      expect(failed && lost2, "ためている間に使うと何も起きず、その手番のあとに消える");
      turn("chargeUp");
      var t4 = turn("harden");
      expect(t4.indexOf("chargeLost") >= 0 && !hero._charged, "次の手番で乗らない技（こうか）を使うと消える");
      var before = foe.currentHp; turn("tackle"); var plain = before - foe.currentHp;
      turn("chargeUp");
      before = foe.currentHp; var t7 = turn("tackle"); var charged = before - foe.currentHp;
      expect(charged > plain * 1.7 && t7.indexOf("chargeLost") < 0 && !hero._charged,
        "次の手番の体当たりに乗って使い切る：" + plain + " → " + charged);
      turn("chargeUp");
      before = foe.currentHp; turn("lightning"); var allHit = before - foe.currentHp;
      var noCharge = tsys.calcDamage(hero, foe, lightning).damage;
      expect(!hero._charged && allHit > 0 && allHit === noCharge, "全体の いなずま には乗らず、ためた力は消える（" + allHit + "。ためていないときと同じ " + noCharge + "）");

      // 眠って動けなかった手番でも消える
      turn("chargeUp");
      hero.addStatus("sleep", MID);
      before = foe.currentHp; var t9 = turn("tackle");
      var slept = foe.currentHp === before;
      expect(!slept || (t9.indexOf("chargeLost") >= 0 && !hero._charged), "眠って動けなかった手番のあとに消える" + (slept ? "" : "（目が覚めて体当たりした。確かめられなかった）"));

      // 即死
      var deathSys = new NS.BattleSystem(gd, MID);
      function chanceOf(skillId, species) {
        var m = new NS.MonsterInstance(species, 20, gd, {});
        return Math.round(gd.skills[skillId].status.chance * deathSys._statusResistMultiplier(m, "instantDeath") * 100);
      }
      var table = [chanceOf("death", "sapSlime"), chanceOf("deathra", "sapSlime"), chanceOf("deathDance", "sapSlime"),
                   chanceOf("death", "glowBug"), chanceOf("death", "slime"), chanceOf("death", "shinigami")];
      expect(table.join(",") === "90,65,50,63,45,0",
        "即死の入る確率：耐性0 で デス・デスラ・死の踊り " + table.slice(0, 3).join("・") + "%／耐性3 デス " + table[3] + "%／耐性5 " + table[4] + "%／シニガミ " + table[5] + "%");
      var want = { glowBug: 3, kodama: 3, gearWarden: 3, magmaBeast: 6, sporin: 0, mossShroom: 0, weaponBot: 0, sapSlime: 0, shinigami: 10, slime: 5, batty: 5, flamin: 5 };
      var wrong = Object.keys(want).filter(function (id) { return !gd.monsters[id] || gd.monsters[id].statusResist.instantDeath !== want[id]; });
      expect(wrong.length === 0 && gd.monsters.sporin.statusResist.curse === 2, "種族の即死の耐性（作者の表）とキノコンの呪い 2" + (wrong.length ? "（違う：" + wrong.join("・") + "）" : ""));
      return { ok: ok, lines: lines };
    }

    // --- 版の名前 ---
    function checkVersion(ctx) {
      var raw = ctx.raw;
      var version = (raw.config || {}).version;
      var versions = ((raw.patchnotes || {}).versions) || [];
      var lines = [], ok = true;
      function expect(cond, text) { if (!cond) ok = false; lines.push((cond ? "" : "✗ ") + text); }

      expect(versions.length && versions[0].version === version,
        "data/config.js は " + version + "・パッチノートの先頭は " + (versions[0] ? versions[0].version : "なし"));
      var devLater = versions.slice(1).filter(function (v) { return v.date === "開発中"; });
      expect(devLater.length === 0, "「開発中」の日付は先頭だけ" + (devLater.length ? "（" + devLater.map(function (v) { return v.version; }).join("・") + " も開発中）" : ""));

      return fetch("README.md?n=" + Date.now()).then(function (r) { return r.ok ? r.text() : ""; }).then(function (text) {
        var m = text.match(/現在のバージョン:\s*([0-9.]+)/);
        expect(m && m[1] === version, "README の「現在のバージョン」は " + (m ? m[1] : "見つからない"));
        return { ok: ok, lines: lines };
      });
    }

    // --- 表示 ---
    function render(results) {
      document.getElementById("loading").style.display = "none";
      var pass = results.filter(function (r) { return r.result.ok; }).length;
      var fail = results.length - pass;
      document.getElementById("summary").innerHTML =
        "<span class='pill " + (fail ? "err" : "good") + "'><b>" + fail + "</b>崩れている</span>" +
        "<span class='pill good'><b>" + pass + "</b>だいじょうぶ</span>";

      var html = "";
      results.forEach(function (r) {
        var ok = r.result.ok;
        html += "<details" + (ok ? "" : " open") + "><summary>" +
          "<span class='tag " + (ok ? "good" : "err") + "'>" + (ok ? "だいじょうぶ" : "崩れている") + "</span>" +
          "<span>" + esc(r.check.title) + "</span>" +
          "<span class='since'>" + esc(r.check.since || "") + "</span></summary>" +
          "<div class='why'>" + esc(r.check.why) + "</div><ul>" +
          (r.result.lines || []).map(function (line) {
            var bad = line.indexOf("✗ ") === 0;
            return "<li" + (bad ? " class='bad'" : "") + ">" + esc(line) + "</li>";
          }).join("") + "</ul></details>";
      });
      document.getElementById("results").innerHTML = html;
    }
  })();
  </script>
</body>
