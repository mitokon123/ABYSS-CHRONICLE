<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>動きの見本 - ABYSS CHRONICLE</title>
  <!--
    ▼ このファイルについて（開発用。ゲーム本体ではない）

    モンスターの動き（data/motions.js）と技の演出（data/effects.js）を、
    戦闘画面と同じ描き方でボタンから1つずつ再生して見るためのページ。RC-1 で作った。
    レベルと性格を変えて、能力値（ゲームと同じ MonsterInstance の計算）も見られる。
    技はすべての技から選べ、選んだ技で上段の相手へ与えるダメージ（BattleSystem.calcDamage）も出る。
    セーブや設定には一切書き込まない。

    ▼ 動きの調整（v1.0.2。右の欄）
    動きの数字をつまみで変えると、その場で見た目が変わる（ページの中の値を書き換えるだけ）。
    開発用サーバー（tools/devserver.py。8124 番）で開いているときだけ、「保存」で data/motions.js の
    いちばん下の「調整ページが書くところ」へ書き込める（ほかの行には触らない。書く前の写しは backup/ に残る）。
    ふつうのサーバー（8123）では試すだけで、保存はできない。

    読み込むファイルは app.html の一覧をそのまま使う（js/main.js だけ除く）ので、
    ゲームにファイルを足しても、ここを直す必要はない。
    ★ 一覧を読むのに fetch を使うので、app.html と同じくサーバー経由（http://〜）で開くこと。
  -->
  <style>
    body { margin: 0; background: #05070d; color: #c8d0e8; font-family: sans-serif; }
    #wrap { display: flex; gap: 16px; padding: 12px; flex-wrap: wrap; align-items: flex-start; }
    /* 戦闘画面のうち、モンスターのまわりだけを切り出して拡大して見せる（操作の欄が横に並ぶ大きさ） */
    #view { height: auto; background: #0a0f1c;
            image-rendering: pixelated; border: 1px solid #2a3350; }
    #panel { width: 240px; }
    h1 { font-size: 18px; margin: 0 0 8px; color: #ffd75e; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: #9aa4c0; }
    button { display: block; width: 100%; margin: 4px 0; padding: 7px 10px; text-align: left;
             background: #141b2e; color: #e8ecf8; border: 1px solid #2a3350; border-radius: 6px;
             cursor: pointer; font-size: 14px; }
    button:hover { background: #1d2742; }
    button.on { border-color: #ffd75e; color: #ffd75e; }
    select { width: 100%; padding: 6px; background: #141b2e; color: #e8ecf8; border: 1px solid #2a3350; }
    .row { display: flex; gap: 6px; }
    .row button { text-align: center; }
    #note { font-size: 12px; color: #6b7590; margin-top: 12px; line-height: 1.6; }
    /* レベルと能力値の欄（絵の下） */
    #left { display: flex; flex-direction: column; gap: 10px; width: min(520px, calc(100vw - 300px)); }
    #left #view { width: 100%; }
    #statsBox { background: #0a0f1c; border: 1px solid #2a3350; padding: 10px 12px; font-size: 13px; }
    #statsBox h2 { margin-top: 0; }
    .lvrow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .lvrow input[type=range] { flex: 1; }
    .lvrow input[type=number] { width: 56px; padding: 4px; background: #141b2e; color: #e8ecf8;
                                border: 1px solid #2a3350; }
    .lvrow button { width: auto; display: inline-block; margin: 0; padding: 4px 9px; text-align: center; }
    #statsBox select { margin-bottom: 8px; }
    #stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #stats th, #stats td { padding: 3px 6px; border-bottom: 1px solid #1d2742; text-align: right; }
    #stats th:first-child, #stats td:first-child { text-align: left; }
    #stats th { color: #9aa4c0; font-weight: normal; font-size: 12px; }
    #stats .up { color: #7fd99a; }
    #stats .dim { color: #6b7590; }
    #expInfo, #skillsKnown { margin-top: 8px; line-height: 1.7; }
    #expInfo .warn { color: #ff9a7a; }
    #damageBox { margin-top: 12px; border-top: 1px solid #2a3350; padding-top: 10px; line-height: 1.7; }
    #damageBox h2 { margin-top: 0; }
    #damageBox .big { font-size: 16px; color: #ffd75e; }
    #damageBox .crit { color: #ff9a7a; }
    #damageBox .dim { color: #6b7590; font-size: 12px; }
    #damageBox label { font-size: 12px; color: #9aa4c0; }
    #skillPick { margin-bottom: 4px; }
    #now { font-size: 13px; color: #ffd75e; min-height: 1.4em; margin-top: 6px; }
    /* 動きの調整の欄 */
    #tune { width: 330px; }
    #tune .tnote { font-size: 12px; color: #6b7590; line-height: 1.6; }
    #tune .tnote.ok { color: #9adfaa; }
    #tune .tnote.warn { color: #ff9a7a; }
    #tune .grp { border: 1px solid #2a3350; background: #0a0f1c; padding: 6px 8px; margin: 8px 0; }
    #tune .grp > .head { display: flex; justify-content: space-between; align-items: center;
                         color: #ffd75e; font-size: 13px; margin-bottom: 4px; }
    #tune .prm { display: flex; gap: 6px; align-items: center; font-size: 12px; margin: 3px 0; }
    #tune .prm > .k { width: 74px; color: #9aa4c0; flex: none; }
    #tune .prm input[type=range] { flex: 1; min-width: 0; }
    #tune .prm input[type=number] { width: 70px; padding: 2px 4px; background: #141b2e; color: #e8ecf8;
                                    border: 1px solid #2a3350; }
    #tune .prm select, #tune .prm input[type=text] { flex: 1; width: auto; padding: 2px 4px; }
    #tune input[type=text], #tune textarea { background: #141b2e; color: #e8ecf8; border: 1px solid #2a3350; }
    #tune textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 12px; }
    #tune .x { width: auto; display: inline-block; margin: 0; padding: 0 7px; text-align: center; font-size: 12px; }
    #tune .row select { flex: 1; }
    #tune .row button { width: auto; }
    #tune details { margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="wrap">
    <!-- 見せる用。ゲームの画面（800×600）はページに出さず、ここへ切り出して描き写す -->
    <div id="left">
      <canvas id="view" width="400" height="400"></canvas>

      <!-- レベルを変えて能力値を見る。戦闘画面の欄（Lv・HP・PP）も同じレベルに変わる -->
      <div id="statsBox">
        <h2>レベルと能力値</h2>
        <div class="lvrow">
          Lv
          <button id="lvDown">−</button>
          <input type="range" id="lv" min="1" max="99" value="30">
          <button id="lvUp">＋</button>
          <input type="number" id="lvNum" min="1" max="99" value="30">
        </div>
        <select id="nature"></select>
        <table id="stats"></table>
        <div id="expInfo"></div>
        <div id="skillsKnown"></div>

        <!-- 選んでいる技で、相手（上段のモンスター）へどれだけ与えるか。ゲームと同じ calcDamage で出す -->
        <div id="damageBox">
          <h2>ダメージ（選んでいる技 → 上段の相手）</h2>
          <select id="foeSpecies"></select>
          <div class="lvrow">
            相手Lv
            <input type="number" id="foeLv" min="1" max="99" value="30">
            <label><input type="checkbox" id="foeFollow" checked> こちらのLvに合わせる</label>
          </div>
          <div id="damageInfo"></div>
        </div>

        <div id="note">特性の補正は込み。装備なし・個体値0・愛情度0・強化なしで計算している。</div>
      </div>
    </div>
    <div id="panel">
      <h1>動きの見本</h1>
      <h2>モンスター</h2>
      <select id="species"></select>

      <h2>技を出す（技の種類で動きが変わる）</h2>
      <select id="skillPick"></select>
      <button id="skillPlay">選んだ技を出す</button>
      <div id="skills"></div>

      <h2>ほかの場面</h2>
      <button data-scene="hit">被弾</button>
      <button id="dodge">回避（相手の攻撃が外れる）</button>
      <button data-scene="levelUp">レベルアップ（スカウトに応じたときも同じ）</button>
      <button id="guard">防御（切り替え）</button>
      <button id="sleep">眠り（切り替え）</button>

      <h2>まとめて</h2>
      <button id="all">全部を順に再生</button>

      <h2>速さ</h2>
      <div class="row">
        <button data-speed="1" class="on">×1</button>
        <button data-speed="0.5">×0.5</button>
        <button data-speed="0.25">×0.25</button>
      </div>
      <div id="now"></div>
      <div id="note">
        開発用のページ。セーブには触れない。<br>
        動きの数字は data/motions.js、共鳴の演出は data/effects.js の resonance。
      </div>
    </div>

    <!-- 動きの調整。つまみで数字を変えるとその場で動きが変わる。開発用サーバーなら保存できる -->
    <div id="tune">
      <h1>動きの調整</h1>
      <div id="tuneStatus" class="tnote">サーバーを確かめています…</div>
      <h2>調整する動き（★＝調整を保存したもの・＊＝保存していない変更あり）</h2>
      <select id="tuneMotion"></select>
      <div id="tuneInfo" class="tnote"></div>
      <div class="row">
        <button id="tunePlay">再生</button>
        <label class="tnote"><input type="checkbox" id="tuneLoop"> くり返す</label>
      </div>
      <div id="tuneFields"></div>
      <div class="row">
        <select id="tuneAdd"></select>
        <button id="tuneAddBtn">足す</button>
      </div>
      <h2>保存</h2>
      <div id="tuneDirty" class="tnote"></div>
      <button id="tuneSave">data/motions.js へ保存</button>
      <button id="tuneRevert">ファイルに入っている値に戻す</button>
      <button id="tuneCopy">新しい名前で写す</button>
      <button id="tuneUntune">保存した調整を消す（本体の値に戻す）</button>
      <details>
        <summary>文字で見る（そのまま書き写せる形）</summary>
        <textarea id="tuneText" rows="12" readonly></textarea>
      </details>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // 技のボタン。[表示, 技id, 当たる相手（"foe" / "self"）]
    var SKILLS = [
      ["通常攻撃", "normalAttack", "foe"],
      ["共鳴：アクア", "aqua", "foe"],
      ["共鳴：キュア（回復）", "cure", "self"],
      ["ブレス：火の息", "fireBreath", "foe"],
      ["体技：体当たり", "tackle", "foe"],
      ["斬撃：噛みつく", "bite", "foe"],
      ["自分にかける：立ち塞がる", "standGuard", "self"]
    ];

    // app.html の読み込み一覧をそのまま使う（js/main.js は起動なので除く）
    fetch("app.html?n=" + Date.now()).then(function (res) { return res.text(); }).then(function (html) {
      var files = [];
      var re = /"((?:js|data)\/[^"]+\.js)"/g, m;
      while ((m = re.exec(html))) {
        if (m[1] !== "js/main.js") files.push(m[1]);
      }
      loadInOrder(files, 0, start);
    });

    function loadInOrder(files, index, done) {
      if (index >= files.length) { done(); return; }
      var s = document.createElement("script");
      s.src = files[index] + "?t=" + Date.now();
      s.onload = function () { loadInOrder(files, index + 1, done); };
      s.onerror = function () { loadInOrder(files, index + 1, done); };
      document.head.appendChild(s);
    }

    function start() {
      var NS = window.MyGame;
      var gd = NS.DataLoader.build(NS.rawData);
      // 念のため、セーブと設定の置き場所を見本用に変えておく（書き込みはしない）
      if (gd.save) gd.save.storageKey = "__viewer.save";
      if (gd.settings) gd.settings.storageKey = "__viewer.settings";

      // ゲームの画面はページに出さない裏の canvas に描き、モンスターのまわりだけを #view へ写す
      var canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 600;
      var view = document.getElementById("view");
      var viewCtx = view.getContext("2d");
      viewCtx.imageSmoothingEnabled = false;
      // 切り出す範囲（敵の段と味方の段がちょうど入る）
      var CROP = { x: 200, y: 30, w: 400, h: 400 };
      var assets = new NS.AssetLoader();
      assets.build(gd.sprites);
      var game = new NS.Game(canvas, gd, assets);
      game.ensureProgress();
      if (game.tutorial) game.tutorial.take = function () { return null; };
      game.clock = 0;

      var speed = 1;
      var scene, hero, foe;
      var queue = [];      // [{ at, fn }] 決まった時刻にやること（当たった瞬間の演出など）
      var sleeping = false;
      var guarding = false;
      var nowLabel = document.getElementById("now");

      // --- モンスターの選択 ---
      var select = document.getElementById("species");
      Object.keys(gd.monsters).forEach(function (id) {
        var o = document.createElement("option");
        o.value = id;
        o.textContent = gd.monsters[id].name;
        select.appendChild(o);
      });
      select.value = "slime";
      select.onchange = function () { build(select.value); };

      // --- レベルと性格 ---
      var level = 30;
      var natureId = "balanced";
      var natureSelect = document.getElementById("nature");
      Object.keys(gd.natures || {}).forEach(function (id) {
        var o = document.createElement("option");
        o.value = id;
        o.textContent = "性格：" + gd.natures[id].name;
        natureSelect.appendChild(o);
      });
      natureSelect.value = natureId;
      natureSelect.onchange = function () { natureId = natureSelect.value; build(select.value); };

      var lvRange = document.getElementById("lv");
      var lvNum = document.getElementById("lvNum");
      var levelCap = (gd.growth && gd.growth.levelCap) || 99;
      lvRange.max = lvNum.max = levelCap;
      function setLevel(value) {
        value = Math.max(1, Math.min(levelCap, Math.round(Number(value) || 1)));
        level = value;
        lvRange.value = lvNum.value = value;
        build(select.value);
      }
      lvRange.oninput = function () { setLevel(lvRange.value); };
      lvNum.onchange = function () { setLevel(lvNum.value); };
      document.getElementById("lvDown").onclick = function () { setLevel(level - 1); };
      document.getElementById("lvUp").onclick = function () { setLevel(level + 1); };

      // 能力値の表。[表示名, 取り出す関数, 成長率のキー, 基礎値のキー]
      var STAT_ROWS = [
        ["HP",     "getMaxHp",   "hp",      "baseHp"],
        ["PP",     "getMaxPp",   "pp",      "basePp"],
        ["攻撃",   "getAttack",  "attack",  "baseAttack"],
        ["防御",   "getDefense", "defense", "baseDefense"],
        ["素早さ", "getSpeed",   "speed",   "baseSpeed"]
      ];
      function num(n) { return Number(n).toLocaleString("ja-JP"); }
      // 「5〜6」の形。両端が同じなら1つだけ出す
      function span(a, b) { return String(a) === String(b) ? String(a) : a + "〜" + b; }

      function renderStats() {
        var species = hero.getSpecies();
        // 1つ前のレベルの同じ個体（どれだけ伸びたかを見せる）
        var prev = level > 1 ? new NS.MonsterInstance(hero.speciesId, level - 1, gd, { nature: natureId }) : null;

        var html = "<tr><th>能力</th><th>基礎</th><th>成長率</th><th>値</th><th>前のLvから</th></tr>";
        STAT_ROWS.forEach(function (row) {
          var value = hero[row[1]]();
          var diff = prev ? value - prev[row[1]]() : 0;
          html += "<tr><td>" + row[0] + "</td>" +
            "<td class='dim'>" + (species[row[3]] || 0) + "</td>" +
            "<td class='dim'>" + hero.getGrowthRate(row[2], level).toFixed(2) + "</td>" +
            "<td>" + num(value) + "</td>" +
            "<td class='" + (diff > 0 ? "up" : "dim") + "'>" + (prev ? (diff > 0 ? "+" : "") + diff : "—") + "</td></tr>";
        });
        document.getElementById("stats").innerHTML = html;

        var maxLevel = hero.getMaxLevel();
        var exp = "次のLvまで " + (level >= levelCap ? "—" : num(hero.getExpToNextLevel(level))) +
          "　／　累計経験値 " + num(hero.getTotalExp()) +
          "<br>レベル上限 Lv" + maxLevel +
          (level > maxLevel ? "　<span class='warn'>（この種族の上限を超えている）</span>" : "");
        document.getElementById("expInfo").innerHTML = exp;

        var names = (hero.skills || []).map(function (id) {
          var skill = gd.getSkill(id);
          return skill ? skill.name : id;
        });
        document.getElementById("skillsKnown").textContent = "覚えている技：" + (names.join("・") || "なし");
      }

      // --- 相手（上段）。ダメージの受け手にもなる ---
      var foeSelect = document.getElementById("foeSpecies");
      Object.keys(gd.monsters).forEach(function (id) {
        var o = document.createElement("option");
        o.value = id;
        o.textContent = "相手：" + gd.monsters[id].name;
        foeSelect.appendChild(o);
      });
      // 既定はキノコン。防御が全23種のちょうど真ん中（Lv30で34）なので、ふつうの相手の目安になる。
      // 硬い相手を見たいときはイワゴロー・モスゴーレムなどに変える
      foeSelect.value = gd.monsters.sporin ? "sporin" : Object.keys(gd.monsters)[0];
      var foeLvInput = document.getElementById("foeLv");
      var foeFollow = document.getElementById("foeFollow");
      foeLvInput.max = levelCap;
      foeSelect.onchange = function () { build(select.value); };
      foeLvInput.onchange = function () { foeFollow.checked = false; build(select.value); };
      foeFollow.onchange = function () { build(select.value); };
      function foeLevel() {
        if (foeFollow.checked) foeLvInput.value = level;
        return Math.max(1, Math.min(levelCap, Math.round(Number(foeLvInput.value) || 1)));
      }

      // --- 技の一覧（すべての技。種類ごとにまとめる） ---
      var skillPick = document.getElementById("skillPick");
      var kinds = (gd.categories && gd.categories.skillKind) || {};
      var groups = [["normal", "通常攻撃"]];
      Object.keys(kinds).sort(function (a, b) { return (kinds[a].order || 0) - (kinds[b].order || 0); })
        .forEach(function (k) { groups.push([k, kinds[k].name]); });
      groups.forEach(function (g) {
        var box = document.createElement("optgroup");
        box.label = g[1];
        Object.keys(gd.skills).forEach(function (id) {
          var s = gd.skills[id];
          var kind = (id === "normalAttack") ? "normal" : s.kind;
          if (kind !== g[0]) return;
          var o = document.createElement("option");
          o.value = id;
          o.textContent = s.name + (s.power ? "（威力" + s.power + "）" : "");
          box.appendChild(o);
        });
        if (box.children.length) skillPick.appendChild(box);
      });
      skillPick.value = "normalAttack";
      skillPick.onchange = renderDamage;
      document.getElementById("skillPlay").onclick = function () {
        var s = gd.getSkill(skillPick.value);
        if (s) playSkill(s.id, targetKindOf(s), s.name);
      };
      function targetKindOf(skill) {
        // 味方全体の技（ベール・鼓舞の舞など）も、こちら側に出す
        return (skill.target === "self" || skill.target === "ally" || skill.target === "allAllies") ? "self" : "foe";
      }

      /**
       * 選んでいる技で、相手へ与えるダメージの幅。ゲームの calcDamage をそのまま使い、
       * 乱数（最小・最大）とクリティカルの有無だけを固定して呼ぶ
       */
      function damageOf(skill, roll, critical) {
        var sys = scene.system;
        var savedRandom = sys.random;
        sys.random = { next: function () { return roll; } };
        sys._rollCritical = function () { return critical; };
        try { return sys.calcDamage(hero, foe, skill); }
        finally { sys.random = savedRandom; delete sys._rollCritical; }
      }

      function renderDamage() {
        var box = document.getElementById("damageInfo");
        var skill = gd.getSkill(skillPick.value);
        if (!skill || !hero || !foe) { box.innerHTML = ""; return; }
        var foeHp = foe.getMaxHp();
        var head = "<span class='dim'>" + foe.getName() + " Lv" + foe.level + "　HP " + num(foeHp) +
          "・防御 " + num(foe.getDefense()) + "</span><br>";

        if (skill.heal) {
          var h = skill.heal;
          var amount = (h.amount !== undefined) ? h.amount : (h.min + "〜" + h.max);
          box.innerHTML = head + skill.name + "：回復 <span class='big'>" + amount + "</span>" +
            (skill.power ? "" : "<br><span class='dim'>ダメージは与えない技</span>");
          if (!skill.power) return;
        }
        if (!NS.BattleSystem.dealsDamage(skill)) {
          box.innerHTML = head + skill.name + "：<span class='dim'>ダメージを与えない技（強化・状態異常など）</span>";
          return;
        }

        var lo = damageOf(skill, 0, false), hi = damageOf(skill, 0.999999, false);
        if (lo.immune) {
          box.innerHTML = head + skill.name + "：<span class='big'>0</span>　（この相手には効かない）";
          return;
        }
        // 何回当てれば倒せるか（少ない方は運が良いとき）
        function hits(d) { return d > 0 ? Math.ceil(foeHp / d) : "—"; }
        var fewest = hits(hi.damage), most = hits(lo.damage);
        var el = lo.elementMultiplier;
        var elText = el > 1 ? "　<span class='crit'>効果抜群 ×" + el + "</span>"
                   : el < 1 ? "　<span class='dim'>いまひとつ ×" + el + "</span>" : "";

        var html = head + skill.name + "：<span class='big'>" + span(num(lo.damage), num(hi.damage)) + "</span>" + elText +
          "<br>相手HPの " + span(Math.round(lo.damage / foeHp * 100), Math.round(hi.damage / foeHp * 100)) + "%" +
          "　／　倒すまで " + span(fewest, most) + "回";

        var critRate = ((gd.battle || {}).critical || {}).baseRate || 0;
        critRate += skill.criticalBonus || 0;
        // 種族の上乗せ（ザンガルド +4%。BattleSystem._rollCritical）
        critRate += (hero._species && hero._species.criticalBonus) || 0;
        if (gd.getSkillRule(skill, "canCritical") !== false && critRate > 0) {
          var clo = damageOf(skill, 0, true), chi = damageOf(skill, 0.999999, true);
          html += "<br><span class='crit'>クリティカル " + span(num(clo.damage), num(chi.damage)) +
            "（" + Math.round(critRate * 100) + "%）</span>";
        } else {
          html += "<br><span class='dim'>クリティカルなし</span>";
        }
        if (skill.drain) html += "<br><span class='dim'>吸収 " + span(Math.max(1, Math.floor(lo.damage * skill.drain)),
          Math.max(1, Math.floor(hi.damage * skill.drain))) + "</span>";
        if (skill.target === "allEnemies") html += "<br><span class='dim'>全体技（1体あたりの値）</span>";
        box.innerHTML = html;
      }

      var afterBuild = [];   // モンスターを作り直したあとにすること（動きの調整の一覧を作り直す）
      function build(speciesId) {
        hero = new NS.MonsterInstance(speciesId, level, gd, { nature: natureId });
        foe = new NS.MonsterInstance(foeSelect.value, foeLevel(), gd);
        scene = new NS.BattleScene(game, [hero], [foe], null, function () {});
        scene.system.start([hero], [foe]);
        scene.phase = "message";
        queue = [];
        if (sleeping) { hero.addStatus("sleep"); }
        hero._defending = guarding;
        scene._captureStatusMarks();
        renderStats();
        renderDamage();
        afterBuild.forEach(function (fn) { fn(speciesId); });
      }
      build("slime");

      // --- 技を出す ---
      var skillBox = document.getElementById("skills");
      SKILLS.forEach(function (entry) {
        var b = document.createElement("button");
        b.textContent = entry[0];
        b.onclick = function () { playSkill(entry[1], entry[2], entry[0]); };
        skillBox.appendChild(b);
      });

      function playSkill(skillId, targetKind, label) {
        var skill = gd.getSkill(skillId);
        if (!skill) return;
        // ダメージの欄も、いま出した技に合わせる
        if (skillPick.value !== skillId) { skillPick.value = skillId; renderDamage(); }
        var target = (targetKind === "self") ? hero : foe;
        var use = { type: "useSkill", actor: hero, actorName: hero.getName(), skill: skill, side: "ally" };
        scene.actionMotions.clear();
        scene._playActionMotion(use);      // 本人の動き＋共鳴のまわりの演出
        scene._playSkillEffect(use);       // 「いま出している技」を覚えさせる
        var kind = scene._skillMotionKind(skill);
        nowLabel.textContent = label + "　（場面: " + kind + " → " + (hero.getActionMotionId(kind) || "動きなし") + "）";

        // 当たる瞬間（動きの半分くらい）に、相手側の演出とのけぞりを出す
        var motionId = hero.getActionMotionId(kind);
        var def = motionId ? gd.motions[motionId] : null;
        // 溜めの長い技（死神の鎌）は、ゲームと同じく windupMs で当たる（data/skills.js）
        var hitAt = game.clock + (skill.windupMs || (def && def.duration ? def.duration * 0.45 : 250));
        // 何回か当てる技（二連斬り）は、ゲームと同じく回数ぶん当たる（少しずつ遅らせる）
        var hitCount = Math.max(1, skill.hits || 1);
        for (var h = 0; h < hitCount; h++) queue.push({ at: hitAt + h * 300, fn: hitOnce });
        function hitOnce() {
          var ev = (skill.modifier && !skill.power)
            // 強化か弱体かはゲームと同じ判定で決める（弱体＝ちからぬきなどは上から下へ流れる）
            ? { type: "modifier", target: target, raised: NS.BattleSystem.isRaising(skill), side: "ally" }
            : { type: "damage", target: target, side: "ally", amount: 1 };
          scene._playSkillEffect(ev);
          // ダメージを与える技なら、相手がのけぞる（相手は上段なので上へ押される）
          if (target === foe && NS.BattleSystem.dealsDamage(skill)) {
            scene._startMotion(foe, "hit", -1);
            // ゲームと同じく乱数とクリティカルを振った1回分の数字を浮かべる（相手のHPは減らさない）
            var hit = scene.system.calcDamage(hero, foe, skill);
            scene._applyStyle(hit.immune ? "immune" : (hit.critical ? "critical" : "damage"),
              foe, String(hit.damage));
          }
          if (skill.heal) scene._startMotion(hero, "heal", 1);
        }
      }

      // --- ほかの場面 ---
      Array.prototype.forEach.call(document.querySelectorAll("[data-scene]"), function (b) {
        b.onclick = function () {
          var kind = b.getAttribute("data-scene");
          scene.actionMotions.clear();
          scene._startMotion(hero, kind, 1);
          nowLabel.textContent = b.textContent + "　（" + (hero.getActionMotionId(kind) || "動きなし") + "）";
        };
      });

      // 回避：相手（上段）が踏み込み、当たる瞬間に外れて、こちらが身をかわす。
      // ゲームと同じ「外れた」出来事を渡すので、眠っている間はかわさないところまで同じになる
      function playDodge() {
        scene.actionMotions.clear();
        scene._startMotion(foe, "attack", 1);
        var motionId = foe.getActionMotionId("attack");
        var def = motionId ? gd.motions[motionId] : null;
        queue.push({ at: game.clock + (def && def.duration ? def.duration * 0.3 : 150), fn: function () {
          scene._playActionMotion({ type: "miss", target: hero, side: "enemy" });
          scene._applyStyle("miss", hero, "MISS");
        } });
        nowLabel.textContent = "回避　（" + (hero.getActionMotionId("dodge") || "動きなし") + "）";
      }
      document.getElementById("dodge").onclick = playDodge;

      var guardBtn = document.getElementById("guard");
      guardBtn.onclick = function () {
        hero._defending = !hero._defending;
        guarding = hero._defending;
        guardBtn.className = guarding ? "on" : "";
        nowLabel.textContent = hero._defending
          ? "防御中　（" + (hero.getActionMotionId("guard") || "動きなし") + "）"
          : "防御を解いた";
      };

      var sleepBtn = document.getElementById("sleep");
      sleepBtn.onclick = function () {
        sleeping = !sleeping;
        if (sleeping) hero.addStatus("sleep"); else hero.removeStatus("sleep");
        scene._captureStatusMarks();
        sleepBtn.className = sleeping ? "on" : "";
        nowLabel.textContent = sleeping ? "眠り（目を閉じて脱力・寝息・z）" : "眠りを解いた";
      };

      // --- 全部を順に ---
      document.getElementById("all").onclick = function () {
        var t = 0;
        SKILLS.forEach(function (entry) {
          queue.push({ at: game.clock + t, fn: function () { playSkill(entry[1], entry[2], entry[0]); } });
          t += 1400;
        });
        ["hit", "levelUp"].forEach(function (kind) {
          queue.push({ at: game.clock + t, fn: function () {
            scene._startMotion(hero, kind, 1);
            nowLabel.textContent = (kind === "hit" ? "被弾" : "レベルアップ");
          } });
          t += 1200;
        });
        queue.push({ at: game.clock + t, fn: playDodge });
      };

      // --- 速さ ---
      Array.prototype.forEach.call(document.querySelectorAll("[data-speed]"), function (b) {
        b.onclick = function () {
          speed = parseFloat(b.getAttribute("data-speed"));
          Array.prototype.forEach.call(document.querySelectorAll("[data-speed]"), function (x) { x.className = ""; });
          b.className = "on";
        };
      });

      // =====================================================================
      // 動きの調整（v1.0.2）
      //   gd.motions の中身をその場で書き換える。ゲームは毎回ここから読むので、すぐ見た目に出る。
      //   ふだんの動き（duration が無いもの）は、いまのモンスターのふだんの動きに差し替えて見せる。
      //   1回だけの動き（duration があるもの）は「再生」で出す（相手の方へ向けて）。
      // =====================================================================
      var CHANNELS = ["offsetX", "offsetY", "scale", "scaleX", "scaleY", "alpha", "rotate", "lift"];
      var CHANNEL_NAMES = { offsetX: "左右", offsetY: "上下", scale: "大きさ", scaleX: "横の大きさ",
                            scaleY: "縦の大きさ", alpha: "濃さ", rotate: "傾き", lift: "浮く" };
      var PARAM_NAMES = { amplitude: "動く量", amount: "動く量", speed: "速さ", period: "1往復(ms)", wave: "波の形",
                          phase: "ずらし", shape: "形", outRatio: "出きる割合", backRatio: "引く割合",
                          cycles: "揺れる回数", count: "回数", duration: "長さ(ms)", interval: "1コマ(ms)",
                          pinTop: "動かさない行", anchor: "伸縮の基準" };
      var PARAM_DEFAULTS = { amplitude: 1, speed: 0.002, period: 2000, wave: "sin", phase: 0, amount: 1, shape: "pulse",
                             outRatio: 0.3, backRatio: 0.45, cycles: 2, count: 2 };
      var WAVES = ["sin", "bounce", "blink"];
      var SCENE_NAMES = { attack: "攻撃", resonance: "共鳴", breath: "ブレス", technique: "体技・斬撃", buff: "自分にかける",
                          hit: "被弾", guard: "防御", dodge: "回避", heal: "回復", faint: "倒れる", levelUp: "レベルアップ" };
      // 形（shape）の候補は、いま使われているものを集める
      var SHAPES = [];
      Object.keys(gd.motions).forEach(function (id) {
        var def = gd.motions[id];
        Object.keys(def).forEach(function (k) {
          if (def[k] && typeof def[k] === "object" && typeof def[k].shape === "string" && SHAPES.indexOf(def[k].shape) < 0) {
            SHAPES.push(def[k].shape);
          }
        });
      });

      var tuneSelect = document.getElementById("tuneMotion");
      var tuneFields = document.getElementById("tuneFields");
      var tuneInfo = document.getElementById("tuneInfo");
      var tuneStatus = document.getElementById("tuneStatus");
      var tuneDirty = document.getElementById("tuneDirty");
      var tuneText = document.getElementById("tuneText");
      var tuneLoop = document.getElementById("tuneLoop");
      var canSave = false;
      var cur = null;            // { id, def（gd.motions の中身そのもの） }
      // ファイルに入っている値（開いたときの値。保存したらその値）。これと違えば「保存していない変更」
      var baseline = JSON.parse(JSON.stringify(gd.motions));
      var idleBackup = {};       // 差し替える前の、種族のふだんの動き
      var tunedIds = (NS.rawData.motionsTuned || []).slice();

      function copyOf(v) { return JSON.parse(JSON.stringify(v)); }
      function isOneShot(def) { return !!(def && def.duration); }

      fetch("/api/ping").then(function (r) { return r.json(); }).then(function (d) {
        canSave = !!(d && d.canSave);
      }).catch(function () { canSave = false; }).then(function () {
        tuneStatus.className = "tnote " + (canSave ? "ok" : "warn");
        tuneStatus.textContent = canSave
          ? "開発用サーバーで開いています。保存できます。"
          : "ふつうのサーバーで開いています。試せますが保存はできません（開発用サーバー abyss-tools から開くと保存できる）。";
        updateDirty();
      });

      /** いまのモンスターの動き（ふだん・場面ごと）を上に、すべての動きを下に並べる */
      function refreshTuneList(keepId) {
        var species = hero.getSpecies();
        tuneSelect.innerHTML = "";
        function add(group, id, label) {
          if (!gd.motions[id]) return;
          var o = document.createElement("option");
          o.value = id;
          o.textContent = (tunedIds.indexOf(id) >= 0 ? "★ " : "") + (isDirty(id) ? "＊ " : "") + label;
          group.appendChild(o);
        }
        var mine = document.createElement("optgroup");
        mine.label = species.name + " の動き";
        var idleId = idleBackup[hero.speciesId] !== undefined ? idleBackup[hero.speciesId] : species.motion;
        if (idleId) add(mine, idleId, "ふだん：" + idleId);
        Object.keys(SCENE_NAMES).forEach(function (kind) {
          var id = hero.getActionMotionId(kind);
          if (id) add(mine, id, SCENE_NAMES[kind] + "：" + id);
        });
        tuneSelect.appendChild(mine);
        var all = document.createElement("optgroup");
        all.label = "すべての動き";
        Object.keys(gd.motions).forEach(function (id) { add(all, id, id); });
        tuneSelect.appendChild(all);
        tuneSelect.value = keepId && gd.motions[keepId] ? keepId : (idleId || Object.keys(gd.motions)[0]);
        selectMotion(tuneSelect.value);
      }

      /** 差し替えていたふだんの動きを元に戻す */
      function restoreIdle() {
        Object.keys(idleBackup).forEach(function (sid) { gd.monsters[sid].motion = idleBackup[sid]; });
        idleBackup = {};
      }

      function selectMotion(id) {
        restoreIdle();
        var def = gd.motions[id];
        cur = { id: id, def: def };
        // ふだんの動きは、いまのモンスターのふだんの動きにして見せる
        if (!isOneShot(def)) {
          idleBackup[hero.speciesId] = gd.monsters[hero.speciesId].motion;
          gd.monsters[hero.speciesId].motion = id;
        }
        // どの種族が使っているか
        var users = [];
        Object.keys(gd.monsters).forEach(function (sid) {
          var m = gd.monsters[sid];
          var idle = idleBackup[sid] !== undefined ? idleBackup[sid] : m.motion;
          if (idle === id) users.push(m.name + "（ふだん）");
          Object.keys(m.motions || {}).forEach(function (k) {
            if (m.motions[k] === id) users.push(m.name + "（" + (SCENE_NAMES[k] || k) + "）");
          });
        });
        Object.keys((gd.motionDefaults || {}).action || {}).forEach(function (k) {
          if (gd.motionDefaults.action[k] === id) users.push("既定の" + (SCENE_NAMES[k] || k));
        });
        tuneInfo.textContent = (isOneShot(def) ? "1回だけの動き（再生で出す）" : "ふだんの動き（いまのモンスターに付けて見せている）") +
          "。使っているもの：" + (users.join("、") || "なし");
        document.getElementById("tunePlay").disabled = !isOneShot(def);
        renderFields();
        if (isOneShot(def)) playTuned();
      }

      tuneSelect.onchange = function () {
        // 保存していない変更は、ほかの動きを選んでもページの中には残る（★の無い「＊」の印が付く）
        selectMotion(tuneSelect.value);
      };
      // モンスターを変えたら、そのモンスターのふだんの動きを選ぶ。レベルや性格を変えただけなら選んだまま
      var tuneSpecies = hero.speciesId;
      afterBuild.push(function (speciesId) {
        var same = speciesId === tuneSpecies;
        tuneSpecies = speciesId;
        if (!same && cur) restoreIdle();   // 前のモンスターのふだんの動きを戻してから、一覧を作り直す
        refreshTuneList(same && cur ? cur.id : null);
      });

      /** 1回だけの動きを、相手（上）の方へ向けて出す */
      function playTuned() {
        if (!cur || !isOneShot(cur.def)) return;
        scene.actionMotions.clear();
        scene.actionMotions.play(hero, cur.id, game.clock, -1);
        nowLabel.textContent = "調整中：" + cur.id;
        if (tuneLoop.checked) {
          var id = cur.id;
          queue.push({ at: game.clock + cur.def.duration + 500, fn: function () {
            if (tuneLoop.checked && cur && cur.id === id) playTuned();
          } });
        }
      }
      document.getElementById("tunePlay").onclick = playTuned;
      tuneLoop.onchange = function () { if (tuneLoop.checked) playTuned(); };

      // --- 数字の欄 ---

      /** つまみの範囲 [最小, 最大, 刻み]。今の値が外にあれば広げる */
      function rangeOf(key, channel, value) {
        var r;
        if (key === "amplitude" || key === "amount") {
          r = /^(offset|lift)/.test(channel) ? [-40, 40, 0.1] : (channel === "rotate" ? [-1, 1, 0.002] : [-1, 1, 0.005]);
        } else {
          r = { period: [100, 8000, 10], speed: [0, 0.02, 0.0001], phase: [0, 1, 0.01], outRatio: [0, 1, 0.01],
                backRatio: [0, 1, 0.01], cycles: [1, 8, 1], count: [1, 8, 1], duration: [50, 3000, 10],
                interval: [40, 1000, 10], pinTop: [0, 32, 1] }[key] || [-100, 100, 0.1];
        }
        r = r.slice();
        if (value < r[0]) r[0] = value;
        if (value > r[1]) r[1] = value;
        return r;
      }

      /** 1項目の欄。obj[key] を書き換える。channel はつまみの範囲を決めるため */
      function paramRow(obj, key, channel, onRemove) {
        var row = document.createElement("div");
        row.className = "prm";
        var k = document.createElement("span");
        k.className = "k";
        k.textContent = PARAM_NAMES[key] || key;
        k.title = key;
        row.appendChild(k);
        var v = obj[key];

        if (key === "wave" || key === "shape" || key === "anchor") {
          var sel = document.createElement("select");
          var opts = key === "wave" ? WAVES : key === "shape" ? SHAPES : ["top"];
          if (opts.indexOf(v) < 0) opts = opts.concat([v]);
          opts.forEach(function (o) {
            var e = document.createElement("option");
            e.value = o; e.textContent = o;
            sel.appendChild(e);
          });
          sel.value = v;
          sel.onchange = function () { obj[key] = sel.value; changed(); };
          row.appendChild(sel);
        } else if (typeof v === "number") {
          var r = rangeOf(key, channel, v);
          var range = document.createElement("input");
          range.type = "range"; range.min = r[0]; range.max = r[1]; range.step = r[2]; range.value = v;
          var num = document.createElement("input");
          num.type = "number"; num.step = r[2]; num.value = v;
          range.oninput = function () { obj[key] = Number(range.value); num.value = range.value; changed(); };
          num.onchange = function () {
            var n = Number(num.value);
            if (!isFinite(n)) { num.value = obj[key]; return; }
            obj[key] = n;
            if (n < Number(range.min)) range.min = n;
            if (n > Number(range.max)) range.max = n;
            range.value = n;
            changed();
          };
          row.appendChild(range);
          row.appendChild(num);
        } else if (typeof v === "boolean") {
          var cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = v;
          cb.onchange = function () { obj[key] = cb.checked; changed(); };
          row.appendChild(cb);
        } else {
          // 並び（poses など）や、ほかの形の値は文字で直す
          var ta = document.createElement("textarea");
          ta.rows = Array.isArray(v) ? Math.min(8, v.length + 2) : 2;
          ta.value = JSON.stringify(v, null, Array.isArray(v) ? 0 : 2).replace(/\},\{/g, "},\n{");
          ta.onchange = function () {
            try { obj[key] = JSON.parse(ta.value); ta.style.borderColor = ""; changed(); }
            catch (e) { ta.style.borderColor = "#ff9a7a"; }
          };
          row.appendChild(ta);
        }

        if (onRemove) {
          var x = document.createElement("button");
          x.className = "x"; x.textContent = "×"; x.title = "この項目を消す";
          x.onclick = onRemove;
          row.appendChild(x);
        }
        return row;
      }

      /** 項目のまとまり（チャンネル1つ、または「全体」） */
      function group(title, onRemove) {
        var g = document.createElement("div");
        g.className = "grp";
        var head = document.createElement("div");
        head.className = "head";
        head.textContent = title;
        if (onRemove) {
          var x = document.createElement("button");
          x.className = "x"; x.textContent = "消す";
          x.onclick = onRemove;
          head.appendChild(x);
        }
        g.appendChild(head);
        tuneFields.appendChild(g);
        return g;
      }

      function renderFields() {
        var def = cur.def;
        tuneFields.innerHTML = "";

        // 全体（長さ・伸縮の基準・動かさない行・コマ絵・ポーズなど、チャンネル以外）
        var top = Object.keys(def).filter(function (k) { return CHANNELS.indexOf(k) < 0; });
        if (top.length) {
          var g = group("全体");
          top.forEach(function (k) {
            if (k === "frames" && def.frames && typeof def.frames === "object" && !Array.isArray(def.frames)) {
              Object.keys(def.frames).forEach(function (fk) { g.appendChild(paramRow(def.frames, fk, "frames")); });
              return;
            }
            g.appendChild(paramRow(def, k, "", k === "duration" ? null : function () { delete def[k]; changed(true); }));
          });
        }

        CHANNELS.forEach(function (ch) {
          if (!def[ch] || typeof def[ch] !== "object") return;
          var spec = def[ch];
          var g = group((CHANNEL_NAMES[ch] || ch) + "（" + ch + "）", function () { delete def[ch]; changed(true); });
          Object.keys(spec).forEach(function (pk) {
            g.appendChild(paramRow(spec, pk, ch, function () { delete spec[pk]; changed(true); }));
          });
          // 項目を足す
          var missing = (isOneShot(def) ? ["amount", "shape", "outRatio", "backRatio", "cycles", "count"]
                                        : ["amplitude", "speed", "period", "wave", "phase"])
            .filter(function (pk) { return spec[pk] === undefined; });
          if (missing.length) {
            var row = document.createElement("div");
            row.className = "prm";
            var sel = document.createElement("select");
            missing.forEach(function (pk) {
              var o = document.createElement("option");
              o.value = pk; o.textContent = "＋ " + (PARAM_NAMES[pk] || pk) + "（" + pk + "）";
              sel.appendChild(o);
            });
            var b = document.createElement("button");
            b.className = "x"; b.textContent = "足す";
            b.onclick = function () { spec[sel.value] = PARAM_DEFAULTS[sel.value]; changed(true); };
            row.appendChild(sel);
            row.appendChild(b);
            g.appendChild(row);
          }
        });

        // 下の「足す」：まだ無いチャンネルと、全体の項目
        var addSel = document.getElementById("tuneAdd");
        addSel.innerHTML = "";
        CHANNELS.forEach(function (ch) {
          if (def[ch]) return;
          var o = document.createElement("option");
          o.value = ch; o.textContent = "＋ " + CHANNEL_NAMES[ch] + "（" + ch + "）を動かす";
          addSel.appendChild(o);
        });
        [["anchor", "top"], ["pinTop", 0]].forEach(function (p) {
          if (def[p[0]] !== undefined) return;
          var o = document.createElement("option");
          o.value = p[0]; o.textContent = "＋ " + PARAM_NAMES[p[0]] + "（" + p[0] + "）";
          addSel.appendChild(o);
        });
        updateText();
        updateDirty();
      }

      document.getElementById("tuneAddBtn").onclick = function () {
        var key = document.getElementById("tuneAdd").value;
        if (!key || !cur) return;
        if (CHANNELS.indexOf(key) >= 0) {
          cur.def[key] = isOneShot(cur.def) ? { amount: 1, shape: "pulse" } : { amplitude: 1, period: 2000 };
        } else {
          cur.def[key] = key === "anchor" ? "top" : 0;
        }
        changed(true);
      };

      /** 値が変わった。rebuild なら欄を作り直す（項目が増えた・減ったとき） */
      function changed(rebuild) {
        if (rebuild) renderFields();
        else { updateText(); updateDirty(); }
        if (isOneShot(cur.def) && tuneLoop.checked === false) playTuned();
      }

      function updateText() {
        tuneText.value = cur.id + ": " + JSON.stringify(cur.def, null, 2)
          .replace(/"([A-Za-z_][A-Za-z0-9_]*)":/g, "$1:") + ",";
      }

      /** その動き（省けばいま選んでいるもの）が、ファイルに入っている値と違うか */
      function isDirty(id) {
        id = id || (cur && cur.id);
        if (!id || !gd.motions[id]) return false;
        return JSON.stringify(gd.motions[id]) !== JSON.stringify(baseline[id]);
      }
      function dirtyIds() { return Object.keys(gd.motions).filter(function (id) { return isDirty(id); }); }
      function updateDirty() {
        var dirty = isDirty();
        var others = dirtyIds().filter(function (id) { return id !== cur.id; });
        tuneDirty.className = "tnote" + (dirty || others.length ? " warn" : "");
        tuneDirty.textContent = (dirty ? "この動きに、まだ保存していない変更があります。" : "この動きに、保存していない変更はありません。") +
          (others.length ? "　ほかにも保存していないもの：" + others.join("、") : "");
        // 一覧の「＊」を付け直す（選んでいる動きの行だけ）
        Array.prototype.forEach.call(tuneSelect.options, function (o) {
          if (o.value !== cur.id) return;
          o.textContent = o.textContent.replace(/^(★ )?(＊ )?/, function (all, star) {
            return (star || "") + (dirty ? "＊ " : "");
          });
        });
        document.getElementById("tuneSave").disabled = !canSave;
        document.getElementById("tuneRevert").disabled = !baseline[cur.id];
        document.getElementById("tuneUntune").disabled = !canSave || tunedIds.indexOf(cur.id) < 0;
      }
      window.addEventListener("beforeunload", function (e) {
        if (dirtyIds().length) { e.preventDefault(); e.returnValue = ""; }
      });

      document.getElementById("tuneRevert").onclick = function () {
        if (!cur || !baseline[cur.id]) return;
        // 中身を入れ替える（gd.motions の同じ入れ物のまま。ゲームが持っている参照を切らない）
        Object.keys(cur.def).forEach(function (k) { delete cur.def[k]; });
        var back = copyOf(baseline[cur.id]);
        Object.keys(back).forEach(function (k) { cur.def[k] = back[k]; });
        changed(true);
      };

      function post(path, body) {
        return fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Dev-Tool": "1" },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); });
      }

      document.getElementById("tuneSave").onclick = function () {
        if (!cur || !canSave) return;
        post("/api/motions/save", { id: cur.id, definition: cur.def }).then(function (res) {
          if (!res.ok) { alert("保存できませんでした：" + res.error); return; }
          tunedIds = res.tuned;
          baseline[cur.id] = copyOf(cur.def);
          tuneStatus.className = "tnote ok";
          tuneStatus.textContent = cur.id + " を保存しました（保存の前の写し：backup/" + res.backup + "）。";
          refreshTuneList(cur.id);
        }).catch(function () { alert("保存できませんでした（サーバーに届かない）"); });
      };

      document.getElementById("tuneUntune").onclick = function () {
        if (!cur || tunedIds.indexOf(cur.id) < 0) return;
        if (!confirm(cur.id + " の保存した調整を消して、data/motions.js の本体の値に戻します。よろしいですか？")) return;
        post("/api/motions/save", { id: cur.id, definition: null }).then(function (res) {
          if (!res.ok) { alert("消せませんでした：" + res.error); return; }
          tunedIds = res.tuned;
          baseline[cur.id] = copyOf(cur.def);   // ページを開き直すまでは、いまの値が見えたまま
          tuneStatus.className = "tnote ok";
          tuneStatus.textContent = "調整を消しました。本体の値はページを開き直すと出ます。";
          updateDirty();
        });
      };

      document.getElementById("tuneCopy").onclick = function () {
        if (!cur) return;
        var id = prompt("新しい動きの名前（半角の英字で始まり、英数字と _ だけ）", cur.id + "2");
        if (!id) return;
        if (!/^[A-Za-z][A-Za-z0-9_]{0,47}$/.test(id)) { alert("名前は半角の英字で始め、英数字と _ だけにしてください。"); return; }
        if (gd.motions[id]) { alert(id + " はもうあります。"); return; }
        // 写しはまだどこにも保存されていない（baseline に無いので「＊」が付く）
        gd.motions[id] = copyOf(cur.def);
        refreshTuneList(id);
        tuneStatus.className = "tnote";
        tuneStatus.textContent = id + " を作りました（まだ保存していない）。種族に使わせるときは、data/monsters.js に書く必要がある。";
      };

      refreshTuneList();

      // --- 描画のループ（ゲームの時計を、選んだ速さで進める） ---
      var ctx = canvas.getContext("2d");
      var last = performance.now();
      function frame(now) {
        var dt = Math.min(50, now - last);
        last = now;
        game.clock += dt * speed;

        queue.sort(function (a, b) { return a.at - b.at; });
        while (queue.length && queue[0].at <= game.clock) queue.shift().fn();

        scene.actionMotions.update(game.clock);
        scene.skillEffects.update(game.clock);
        // 浮かぶ文字（MISS など）と画面の揺れも進める。進めないと消えずに残って重なる
        scene.floatingText.update(dt * speed);
        scene.screenEffects.update(dt * speed);
        scene.render(ctx);
        viewCtx.clearRect(0, 0, view.width, view.height);
        viewCtx.drawImage(canvas, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, view.width, view.height);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
