<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>効果音の一覧 - ABYSS CHRONICLE</title>
  <!--
    ▼ このファイルについて（開発用。ゲーム本体ではない）

    data/audio.js の BGM と効果音を並べて、その場で鳴らす（v1.0.2）。
    ・鳴らす大きさは、ゲームの設定が最初の値（全体70%・BGM70%・効果音80%）のときと同じ
    ・「使っている所」は、データ（技の se など）とコード（playSe("…") など）で その id が出てくる所
    ・音量の欄を変えると、その大きさで鳴る。開発用サーバー（8124）で開いていれば、
      「変えた音量を書き込む」で data/audio.js の volume に書ける（前 → 後の一覧を出してから。直前のファイルは backup/ に残る）
    ・フォルダ（assets/audio/）にあって使っていないファイルも、開発用サーバーで開いたときだけ並ぶ（鳴らせる）
  -->
  <style>
    body { margin: 0; background: #05070d; color: #c8d0e8; font-family: sans-serif; font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 90px; }
    h1 { font-size: 20px; color: #ffd75e; margin: 0 0 4px; }
    h1 a { font-size: 12px; color: #6b7590; margin-left: 12px; font-weight: normal; }
    h2 { font-size: 15px; color: #ffd75e; margin: 22px 0 6px; }
    .sub { color: #6b7590; font-size: 12px; line-height: 1.6; }
    #tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 10px 0; }
    input[type=search], button, input.vol { background: #141b2e; color: #e8ecf8; border: 1px solid #2a3350; border-radius: 4px; padding: 4px 8px; font-size: 13px; }
    button { cursor: pointer; white-space: nowrap; }
    button:hover { border-color: #ffd75e; }
    button.play { padding: 2px 8px; margin: 1px 2px; }
    button.play.on { background: #3a3010; border-color: #ffd75e; color: #ffd75e; }
    button.primary { background: #3a3010; border-color: #ffd75e; color: #ffd75e; }
    button:disabled { opacity: 0.4; cursor: default; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; color: #6b7590; font-weight: normal; font-size: 12px; padding: 4px 6px; border-bottom: 1px solid #2a3350; }
    td { padding: 4px 6px; border-bottom: 1px solid #141b2e; vertical-align: top; }
    td.id code { color: #e8ecf8; font-size: 13px; }
    td.id .cm { display: block; color: #6b7590; font-size: 11px; }
    .file { font-family: monospace; font-size: 12px; white-space: nowrap; }
    .file.missing { color: #ff7a7a; }
    .flag { font-size: 11px; color: #8fb4e8; background: #142440; padding: 0 5px; border-radius: 3px; margin-right: 3px; white-space: nowrap; }
    .uses { font-size: 11px; color: #6b7590; font-family: monospace; line-height: 1.5; }
    .uses b { color: #9aa4c0; font-weight: normal; }
    input.vol { width: 56px; text-align: right; font-family: monospace; padding: 2px 4px; }
    input.vol.changed { border-color: #ffd75e; background: #2a2410; color: #ffd75e; }
    input.vol.bad { border-color: #e85a5a; background: #2a1010; }
    .none { color: #4e5876; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; background: #0e1424; border-top: 1px solid #2a3350; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    #bar .count { color: #ffd75e; }
    #bar .note { color: #6b7590; font-size: 12px; }
    #msg { color: #9adfaa; font-size: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>効果音の一覧 <a href="dev.html">← 開発用の目次</a></h1>
    <div class="sub">
      data/audio.js の BGM と効果音。▶ で鳴らす（ゲームの音量設定が最初の値のときと同じ大きさ）。
      音量の欄を変えると、その大きさで鳴る。開発用サーバーで開いていれば、変えた音量を data/audio.js に書ける。
    </div>
    <div id="tools">
      <input type="search" id="search" placeholder="id・ファイル名・使っている所で絞る">
      <button id="stop">■ ぜんぶ止める</button>
      <span class="sub" id="server"></span>
    </div>
    <div id="msg"></div>
    <div id="body" class="sub">ゲームのデータを読んでいます…</div>
  </main>
  <div id="bar">
    <span class="count" id="count">音量の変更なし</span>
    <button class="primary" id="save" disabled>変えた音量を書き込む</button>
    <button id="undo" disabled>音量の変更を取り消す</button>
    <span class="note" id="barNote"></span>
  </div>

  <script src="tools/devpage.js"></script>
  <script>
  (function () {
    "use strict";
    var D = window.DevPage, esc = D.esc;
    var $ = function (id) { return document.getElementById(id); };
    var raw, am, texts, refs, dev = false, audioText = "";
    var edits = {};          // "se|cursor" → 試す音量
    var playing = [];        // 鳴っている Audio（止めるため）
    var bgmNow = null;

    D.loadGame(function (files) {
      raw = window.MyGame.rawData;
      am = new window.MyGame.AudioManager({ audio: raw.audio }, null);   // 設定なし＝最初の値の大きさ
      am.unlocked = true;
      refs = D.references(raw);
      Promise.all([D.sources(files), D.ping()]).then(function (r) {
        texts = r[0]; dev = r[1];
        audioText = texts["data/audio.js"] || "";
        $("server").textContent = dev ? "開発用サーバーで開いています（音量を書き込めます）" : "ふつうのサーバーで開いています（鳴らすだけ。書き込みは開発用サーバーで）";
        $("barNote").textContent = dev ? "書き込む前に、前 → 後の一覧が出ます。直前のファイルは backup/ に残ります。" : "";
        var extra = dev ? fetch("/api/audio-files").then(function (x) { return x.json(); }).then(function (d) { return d.files; }) : Promise.resolve(null);
        return Promise.all([extra, existence()]);
      }).then(function (r) { render(r[0], r[1]); });
    });

    // --- 調べもの ---
    function fileList(def) { return !def.file ? [] : Array.isArray(def.file) ? def.file : [def.file]; }

    function existence() {
      var base = raw.audio.basePath || "";
      var names = {};
      ["bgm", "se"].forEach(function (k) { Object.keys(raw.audio[k]).forEach(function (id) { fileList(raw.audio[k][id]).forEach(function (f) { names[f] = true; }); }); });
      var out = {};
      return Promise.all(Object.keys(names).map(function (f) {
        return fetch(base + encodeURIComponent(f), { method: "HEAD" }).then(function (r) { out[f] = r.ok; }, function () { out[f] = false; });
      })).then(function () { return out; });
    }

    // data/audio.js で、その id の行の注意書き（同じ行の // … か、すぐ上の // の行）
    function noteOf(kind, id) {
      var block = audioText.indexOf("\n    " + kind + ": {");
      if (block < 0) return "";
      var lines = audioText.slice(block).split("\n");
      for (var i = 1; i < lines.length; i++) {
        if (/^    \}/.test(lines[i])) break;
        var m = lines[i].match(new RegExp("^      " + id + ":\\s*\\{"));
        if (!m) continue;
        var same = lines[i].match(/\/\/\s*(.+)$/);
        if (same) return same[1];
        var prev = lines[i - 1].match(/^\s*\/\/\s*(.+)$/);
        return prev ? prev[1] : "";
      }
      return "";
    }

    function usesOf(kind, id) {
      var data = refs.filter(function (r) { return r.space === kind && r.value === id; }).map(function (r) { return r.path; });
      // コードは、音を鳴らす行（playSe / playBgm / se / bgm と書いてある行）だけ。
      // "fire" のような id は属性の名前としても出てくるので、それを数えないため
      var code = D.findInText(texts, id, function (f) { return f.indexOf("js/") === 0; })
        .filter(function (h) { return /se|bgm/i.test(texts[h.file].split("\n")[h.line - 1]); })
        .map(function (h) { return h.file.replace(/^js\//, "") + ":" + h.line; });
      return { data: data, code: code };
    }

    // --- 鳴らす ---
    var GAIN = { bgm: 0.7 * 0.7, se: 0.7 * 0.8 };   // 設定の最初の値（data/settings.js）
    function volumeOf(kind, id) {
      var k = kind + "|" + id;
      return (k in edits && typeof edits[k] === "number") ? edits[k] : (raw.audio[kind][id].volume === undefined ? 1 : raw.audio[kind][id].volume);
    }

    function stopAll() {
      playing.forEach(function (a) { try { a.pause(); } catch (e) { /* 止まっていてもよい */ } });
      playing = [];
      bgmNow = null;
      document.querySelectorAll("button.play.on").forEach(function (b) { b.classList.remove("on"); });
    }

    function playFile(kind, id, file, button) {
      if (kind === "bgm") {
        var wasMe = bgmNow === button;
        stopAll();
        if (wasMe) return;   // 2回押すと止まる
        bgmNow = button;
      }
      var a = new Audio((raw.audio.basePath || "") + file);
      a.volume = Math.max(0, Math.min(1, volumeOf(kind, id) * GAIN[kind]));
      a.loop = kind === "bgm" && raw.audio.bgm[id].loop !== false;
      a.onended = function () { button.classList.remove("on"); };
      button.classList.add("on");
      a.play().catch(function () { button.classList.remove("on"); $("msg").textContent = file + " を鳴らせませんでした。"; });
      playing.push(a);
      if (kind === "se") setTimeout(function () { button.classList.remove("on"); }, 400);
    }

    function playSynth(id, button) {
      am._playSynth({ synth: raw.audio.se[id].synth, volume: volumeOf("se", id) });
      button.classList.add("on");
      setTimeout(function () { button.classList.remove("on"); }, 400);
    }

    // --- 画面 ---
    function render(extraFiles, exists) {
      $("body").className = "";
      $("body").innerHTML = "";
      section("bgm", "BGM（data/audio.js の bgm）", exists);
      section("se", "効果音（data/audio.js の se）", exists);
      if (extraFiles) {
        var named = {};
        ["bgm", "se"].forEach(function (k) { Object.keys(raw.audio[k]).forEach(function (id) { fileList(raw.audio[k][id]).forEach(function (f) { named[f] = true; }); }); });
        var extra = extraFiles.filter(function (f) { return !named[f] && /\.(mp3|ogg|wav|m4a)$/i.test(f); });
        var h = document.createElement("h2");
        h.textContent = "フォルダにあって使っていないファイル（assets/audio/）";
        $("body").appendChild(h);
        var box = document.createElement("div");
        if (!extra.length) box.innerHTML = "<span class='none'>なし</span>";
        extra.forEach(function (f) {
          var b = document.createElement("button");
          b.className = "play";
          b.textContent = "▶ " + f;
          b.onclick = function () {
            var a = new Audio((raw.audio.basePath || "") + f);
            a.volume = 0.5 * GAIN.se;
            stopAll(); playing.push(a); a.play();
          };
          box.appendChild(b);
        });
        $("body").appendChild(box);
      }
      $("search").oninput = filter;
      $("stop").onclick = stopAll;
      $("save").onclick = save;
      $("undo").onclick = function () { edits = {}; render(extraFiles, exists); updateBar(); };
      window.onbeforeunload = function (e) { if (Object.keys(edits).length) { e.preventDefault(); e.returnValue = ""; } };
      filter();
    }

    function section(kind, title, exists) {
      var h = document.createElement("h2");
      h.textContent = title + "　" + Object.keys(raw.audio[kind]).length + " 個";
      $("body").appendChild(h);
      var wrap = document.createElement("div");
      wrap.className = "scroll";
      var table = document.createElement("table");
      table.innerHTML = "<tr><th>id</th><th>ファイル</th><th>音量</th><th>鳴らす</th><th>使っている所</th></tr>";
      Object.keys(raw.audio[kind]).forEach(function (id) {
        var def = raw.audio[kind][id];
        var tr = document.createElement("tr");
        tr.className = "row";
        var note = noteOf(kind, id);
        var files = fileList(def);
        var uses = usesOf(kind, id);
        var flags = [];
        if (def.solo) flags.push("重ねない");
        if (kind === "bgm" && def.loop === false) flags.push("繰り返さない");
        if (def.synth) flags.push(files.length ? "合成もある（ファイル優先）" : "合成の音");
        if (files.length > 1) flags.push("毎回どれか");

        tr.innerHTML =
          "<td class='id'><code>" + esc(id) + "</code>" + (note ? "<span class='cm'>" + esc(note) + "</span>" : "") + "</td>" +
          "<td>" + (files.length ? files.map(function (f) {
            return "<div class='file" + (exists[f] ? "" : " missing") + "'>" + esc(f) + (exists[f] ? "" : "（無い）") + "</div>";
          }).join("") : "<span class='none'>" + (def.synth ? "" : "なし（無音）") + "</span>") +
          flags.map(function (f) { return "<span class='flag'>" + esc(f) + "</span>"; }).join("") + "</td>" +
          "<td class='v'></td><td class='p'></td>" +
          "<td class='uses'>" + usesHtml(uses) + "</td>";
        tr.dataset.search = (id + " " + note + " " + files.join(" ") + " " + uses.data.join(" ") + " " + uses.code.join(" ")).toLowerCase();

        // 音量
        var vtd = tr.querySelector("td.v");
        if (def.volume !== undefined) {
          var input = document.createElement("input");
          input.className = "vol";
          var k = kind + "|" + id;
          input.value = (k in edits) ? edits[k] : def.volume;
          if (k in edits) input.classList.add("changed");
          input.title = "data/audio.js の volume（0〜1）。変えるとこの大きさで鳴る";
          input.oninput = function () {
            var s = input.value.trim(), v = Number(s);
            var ok = /^\d+(\.\d+)?$/.test(s) && v >= 0 && v <= 1;
            input.classList.toggle("bad", !ok);
            if (!ok) edits[k] = s;
            else if (v === def.volume) delete edits[k];
            else edits[k] = v;
            input.classList.toggle("changed", ok && k in edits);
            updateBar();
          };
          vtd.appendChild(input);
        } else {
          vtd.innerHTML = "<span class='none'>—</span>";
        }

        // 鳴らす
        var ptd = tr.querySelector("td.p");
        files.forEach(function (f, i) {
          var b = document.createElement("button");
          b.className = "play";
          b.textContent = kind === "bgm" ? "▶ / ■" : (files.length > 1 ? "▶" + (i + 1) : "▶");
          b.disabled = !exists[f];
          b.onclick = function () { playFile(kind, id, f, b); };
          ptd.appendChild(b);
        });
        if (def.synth) {
          var sb = document.createElement("button");
          sb.className = "play";
          sb.textContent = "▶ 合成";
          sb.onclick = function () { playSynth(id, sb); };
          ptd.appendChild(sb);
        }
        table.appendChild(tr);
      });
      wrap.appendChild(table);
      $("body").appendChild(wrap);
    }

    function usesHtml(u) {
      if (!u.data.length && !u.code.length) return "<span style='color:#e8a0a0'>見つからない</span>";
      function part(label, list) {
        if (!list.length) return "";
        var shown = list.slice(0, 4).map(esc).join("<br>");
        return "<b>" + label + "</b><br>" + shown + (list.length > 4 ? "<br>ほか " + (list.length - 4) + " か所" : "") + "<br>";
      }
      return part("データ", u.data) + part("コード", u.code);
    }

    function filter() {
      var q = $("search").value.trim().toLowerCase();
      document.querySelectorAll("tr.row").forEach(function (tr) {
        tr.style.display = (!q || tr.dataset.search.indexOf(q) >= 0) ? "" : "none";
      });
    }

    // --- 音量を書き込む ---
    function updateBar() {
      var keys = Object.keys(edits);
      var bad = keys.filter(function (k) { return typeof edits[k] !== "number"; }).length;
      $("count").textContent = keys.length ? "音量の変更 " + keys.length + " 件" + (bad ? "（0〜1 でないもの " + bad + "）" : "") : "音量の変更なし";
      $("save").disabled = !dev || !keys.length || bad > 0;
      $("undo").disabled = !keys.length;
    }

    function save() {
      var list = Object.keys(edits).map(function (k) {
        var p = k.split("|");
        return { id: p[0], field: p[1] + ".volume", from: raw.audio[p[0]][p[1]].volume, to: edits[k] };
      });
      var text = list.map(function (c) { return c.id + "." + c.field + "　" + c.from + " → " + c.to; }).join("\n");
      if (!confirm("data/audio.js の音量を書き換えます（" + list.length + " か所）。\n\n" + text + "\n\n直前のファイルは backup/ に残ります。書き込みますか？")) return;
      fetch("/api/table/save", {
        method: "POST", headers: { "Content-Type": "application/json", "X-Dev-Tool": "1" },
        body: JSON.stringify({ name: "audio", changes: list })
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res.ok) { alert("書き込めませんでした：" + res.error); return; }
        list.forEach(function (c) { raw.audio[c.id][c.field.split(".")[0]].volume = c.to; });
        edits = {};
        document.querySelectorAll("input.vol.changed").forEach(function (el) { el.classList.remove("changed"); });
        updateBar();
        $("msg").textContent = res.count + " か所を data/audio.js に書き込みました（直前のファイルは backup/" + res.backup + "）。ゲームは開き直すと新しい音量になります。";
      });
    }
  })();
  </script>
</body>
</html>
